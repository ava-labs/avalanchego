name: Cache policy
description: Decide whether this run may save a requested input cache

# This action centralizes shared-cache write policy so every caching action
# applies the same restrictions. See docs/ci.md#ci-cache-policy for the policy
# and its rationale.

inputs:
  request-cache-save:
    description: 'Request permission for this run to save a cache entry'
    required: false
    default: 'false'

outputs:
  cache-save-allowed:
    description: Whether this run may save the requested cache
    value: ${{ steps.policy.outputs.cache-save-allowed }}

runs:
  using: composite
  steps:
    - id: policy
      shell: bash
      env:
        REQUEST_CACHE_SAVE: ${{ inputs.request-cache-save }}
      run: |
        cache_save_allowed=false
        # Temporary: allow PR 6065 to test cache saves. Remove before merging.
        if [[ "$REQUEST_CACHE_SAVE" == 'true' ]] && {
          [[ "$GITHUB_REF" == 'refs/heads/master' ]] ||
          { [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]] && [[ "$GITHUB_REF" == 'refs/pull/6065/merge' ]]; }
        }; then
          cache_save_allowed=true
        fi
        echo "cache-save-allowed=$cache_save_allowed" >> "$GITHUB_OUTPUT"
