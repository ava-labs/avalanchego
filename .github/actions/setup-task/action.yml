name: Setup Task
description: Restore the pinned Task binary from cache or download and verify it

inputs:
  request-cache-save:
    description: 'Request a save when cache policy permits it'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - id: cache-policy
      uses: ./.github/actions/cache-policy
      with:
        request-cache-save: ${{ inputs.request-cache-save }}

    - id: version
      name: Read pinned Task version
      shell: bash
      run: echo "version=$(./scripts/setup_task.sh version)" >> "$GITHUB_OUTPUT"

    - id: cache
      name: Restore Task
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/task/${{ steps.version.outputs.version }}/${{ runner.os }}-${{ runner.arch }}
        key: task-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Download Task
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        TASK_VERSION: ${{ steps.version.outputs.version }}
      run: ./scripts/setup_task.sh download

    - name: Save Task
      # Master creates shared entries; manual validation writes only to its ref.
      if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.cache-policy.outputs.cache-save-allowed == 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/task/${{ steps.version.outputs.version }}/${{ runner.os }}-${{ runner.arch }}
        key: task-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Add Task to PATH
      shell: bash
      env:
        TASK_VERSION: ${{ steps.version.outputs.version }}
      run: ./scripts/setup_task.sh path >> "$GITHUB_PATH"
