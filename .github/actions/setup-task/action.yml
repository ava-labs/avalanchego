name: Setup Task
description: Restore the pinned Task binary from cache or download and verify it

inputs:
  cache-validation:
    description: Use the PR-scoped validation cache
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: Whether the Task cache was restored with an exact key
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: version
      name: Read pinned Task version
      shell: bash
      run: echo "version=$(./scripts/setup_task.sh version)" >> "$GITHUB_OUTPUT"

    - id: cache
      name: Restore Task
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/task/${{ steps.version.outputs.version }}/${{ runner.os }}-${{ runner.arch }}
        key: ${{ inputs.cache-validation == 'true' && format('task-validation-{0}-{1}', runner.os, runner.arch) || format('task-{0}-{1}-{2}', runner.os, runner.arch, steps.version.outputs.version) }}
        restore-keys: |
          ${{ inputs.cache-validation == 'true' && format('task-validation-{0}-{1}', runner.os, runner.arch) || format('task-{0}-{1}-', runner.os, runner.arch) }}

    - name: Download Task
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        TASK_VERSION: ${{ steps.version.outputs.version }}
      run: ./scripts/setup_task.sh download

    - name: Save Task
      # Master saves shared entries; validation runs save only to their PR scope.
      if: ${{ steps.cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/master' || inputs.cache-validation == 'true') }}
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/task/${{ steps.version.outputs.version }}/${{ runner.os }}-${{ runner.arch }}
        key: ${{ inputs.cache-validation == 'true' && format('task-validation-{0}-{1}', runner.os, runner.arch) || format('task-{0}-{1}-{2}', runner.os, runner.arch, steps.version.outputs.version) }}

    - name: Add Task to PATH
      shell: bash
      env:
        TASK_VERSION: ${{ steps.version.outputs.version }}
      run: ./scripts/setup_task.sh path >> "$GITHUB_PATH"
