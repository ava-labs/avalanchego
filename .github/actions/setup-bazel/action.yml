name: 'Setup Bazel'
description: 'Prepare Bazel CI for this job and the later Bazel CI jobs on this platform'

inputs:
  is-setup-job:
    description: 'Whether this invocation is the dedicated Bazel setup job'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - id: cache-policy
      uses: ./.github/actions/cache-policy
      with:
        request-cache-save: ${{ inputs.is-setup-job }}

    # The Go workflow owns Task cache writes.
    - uses: ./.github/actions/setup-task

    - name: Ensure runner disk space
      uses: ./.github/actions/ensure-disk-space
      with:
        diagnostic-groups: bazel

    - id: cache-paths
      shell: bash
      run: |
        repository_cache_dir="$HOME/.cache/bazel-repository-cache"
        go_mod_cache_dir="$HOME/.cache/bazel-go-repository-modcache"
        mkdir -p "$repository_cache_dir" "$go_mod_cache_dir"
        {
          echo "repository_cache=$repository_cache_dir"
          echo "go_mod_cache=$go_mod_cache_dir"
        } >> "$GITHUB_OUTPUT"

    - id: cache-key
      name: Determine Bazel dependency cache key
      shell: bash
      run: |
        cache_key_prefix="bazel-repo-${{ runner.os }}-${{ runner.arch }}-"
        {
          echo "cache-key-prefix=$cache_key_prefix"
          echo "cache-key=${cache_key_prefix}${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'go.work', 'go.work.sum', 'go.mod', 'go.sum', 'graft/coreth/go.mod', 'graft/coreth/go.sum', 'graft/evm/go.mod', 'graft/evm/go.sum', 'graft/subnet-evm/go.mod', 'graft/subnet-evm/go.sum', 'scripts/bazel_ci_dependency_list.sh') }}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Bazel dependency cache
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ steps.cache-paths.outputs.repository_cache }}
          ${{ steps.cache-paths.outputs.go_mod_cache }}
        key: ${{ steps.cache-key.outputs.cache-key }}
        restore-keys: |
          ${{ steps.cache-key.outputs.cache-key-prefix }}

    # Consumers prepare non-exact restores and misses locally. Setup jobs prepare
    # them only when they may save the result.
    - name: Determine Bazel cache operations
      id: cache-operations
      shell: bash
      run: |
        {
          echo "disable-downloads-on-cache-hit=${{ steps.cache.outputs.cache-hit == 'true' && (inputs.is-setup-job != 'true' || steps.cache-policy.outputs.cache-save-allowed == 'true') }}"
          echo "prepare-dependencies=${{ steps.cache.outputs.cache-hit != 'true' && (inputs.is-setup-job != 'true' || steps.cache-policy.outputs.cache-save-allowed == 'true') }}"
          echo "save-cache=${{ steps.cache.outputs.cache-hit != 'true' && steps.cache-policy.outputs.cache-save-allowed == 'true' }}"
        } >> "$GITHUB_OUTPUT"

    - name: Configure Bazel to use dependency cache
      shell: bash
      env:
        REPOSITORY_CACHE_DIR: ${{ steps.cache-paths.outputs.repository_cache }}
        GO_MOD_CACHE_DIR: ${{ steps.cache-paths.outputs.go_mod_cache }}
      run: ${{ github.action_path }}/configure-bazelrc.sh

    # This must precede the metadata check: an exact cache hit must satisfy both
    # metadata validation and the later workload without downloading inputs.
    - name: Disable dependency downloads on direct cache hit
      if: ${{ steps.cache-operations.outputs.disable-downloads-on-cache-hit == 'true' }}
      shell: bash
      run: |
        echo 'common --repository_disable_download' >> "$HOME/.bazelrc"
        echo 'common --repo_env=GOPROXY=off' >> "$HOME/.bazelrc"

    # Bazel metadata must be consistent before any other bazel operations are
    # performed including build dependency caching.
    - name: Check Bazel metadata
      if: ${{ inputs.is-setup-job == 'true' }}
      shell: bash
      run: ./scripts/run_task.sh bazel-check-metadata

    - name: Cache Bazel CI build dependencies
      # A setup job prepares data for a cache save. Consumers prepare only their local
      # cache on a miss, then run offline.
      if: ${{ steps.cache-operations.outputs.prepare-dependencies == 'true' }}
      shell: bash
      run: ./scripts/run_task.sh bazel-cache-ci-build-dependencies

    - name: Save Bazel dependency cache
      # Setup jobs can race to publish a cache miss. Immutable keys prevent an
      # earlier archive from being overwritten.
      if: ${{ steps.cache-operations.outputs.save-cache == 'true' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ steps.cache-paths.outputs.repository_cache }}
          ${{ steps.cache-paths.outputs.go_mod_cache }}
        key: ${{ steps.cache-key.outputs.cache-key }}

    # This cannot share the exact-hit step above: a miss must allow metadata
    # validation and dependency prefetch to download inputs before going offline.
    - name: Disable dependency downloads after cache preparation
      if: ${{ steps.cache-operations.outputs.prepare-dependencies == 'true' }}
      shell: bash
      run: |
        echo 'common --repository_disable_download' >> "$HOME/.bazelrc"
        echo 'common --repo_env=GOPROXY=off' >> "$HOME/.bazelrc"

    - name: Log Bazel disk diagnostics
      if: ${{ failure() }}
      shell: bash
      run: ./scripts/run_task.sh log-ci-disk-state-bazel
