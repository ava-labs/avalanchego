name: 'Set up Go for CI'
description: 'Install Go and manage separate workspace dependency and per-job build caches'

inputs:
  platform_name:
    description: 'Stable platform identifier used in cache keys'
    required: true
  initial_setup:
    description: 'Populate and save the workspace dependency cache'
    required: false
    default: 'false'
  cache_build_results:
    description: 'Restore and save GOCACHE for a cacheable test job'
    required: false
    default: 'false'
  build_cache_scope:
    description: 'Suite-specific GOCACHE namespace'
    required: false
    default: ''
  allow_dependency_download:
    description: 'Let a consumer job download modules instead of failing on a cache miss'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: false

    - id: go-cache-paths
      shell: bash
      run: |
        {
          echo "module=$(go env GOMODCACHE)"
          echo "build=$(go env GOCACHE)"
        } >> "$GITHUB_OUTPUT"

    # This step saves only after the setup job completes. Consumers wait for
    # that job, so they cannot observe or save a partially populated cache.
    - name: Restore and save workspace Go dependencies
      if: ${{ inputs.initial_setup == 'true' }}
      uses: actions/cache@v5
      with:
        path: ${{ steps.go-cache-paths.outputs.module }}
        key: go-dependencies-${{ inputs.platform_name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'go.work', 'go.work.sum', 'graft/coreth/go.mod', 'graft/coreth/go.sum', 'graft/evm/go.mod', 'graft/evm/go.sum', 'graft/subnet-evm/go.mod', 'graft/subnet-evm/go.sum', 'tools/external/go.mod', 'tools/external/go.sum', 'scripts/download_go_dependencies.sh', '.github/actions/setup-go-for-ci/action.yml') }}
        restore-keys: |
          go-dependencies-${{ inputs.platform_name }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore workspace Go dependencies
      if: ${{ inputs.initial_setup != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.go-cache-paths.outputs.module }}
        key: go-dependencies-${{ inputs.platform_name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'go.work', 'go.work.sum', 'graft/coreth/go.mod', 'graft/coreth/go.sum', 'graft/evm/go.mod', 'graft/evm/go.sum', 'graft/subnet-evm/go.mod', 'graft/subnet-evm/go.sum', 'tools/external/go.mod', 'tools/external/go.sum', 'scripts/download_go_dependencies.sh', '.github/actions/setup-go-for-ci/action.yml') }}
        restore-keys: |
          go-dependencies-${{ inputs.platform_name }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Download workspace Go dependencies
      if: ${{ inputs.initial_setup == 'true' }}
      shell: bash
      run: ./scripts/download_go_dependencies.sh

    # Every job that does not find task on PATH builds it from tools/external,
    # which costs about 15 seconds. Build it once in setup and share the binary.
    # Caching the binary instead of the GOCACHE that produced it moves ~13MB
    # rather than ~150MB, and avoids restoring a second cache into the GOCACHE
    # path this action already manages for cacheable test jobs.
    - id: task-bin
      shell: bash
      run: echo "dir=${HOME}/.cache/avalanchego/task-bin" >> "$GITHUB_OUTPUT"

    - name: Restore and save the task binary
      if: ${{ inputs.initial_setup == 'true' }}
      uses: actions/cache@v5
      with:
        path: ${{ steps.task-bin.outputs.dir }}
        key: go-task-${{ inputs.platform_name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'tools/external/go.mod', 'tools/external/go.sum', 'scripts/run_tool.sh', '.github/actions/setup-go-for-ci/action.yml') }}

    # No restore-keys: a binary built from a different tools/external or Go
    # version must not be reused. A miss simply falls back to building task.
    - name: Restore the task binary
      if: ${{ inputs.initial_setup != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.task-bin.outputs.dir }}
        key: go-task-${{ inputs.platform_name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'tools/external/go.mod', 'tools/external/go.sum', 'scripts/run_tool.sh', '.github/actions/setup-go-for-ci/action.yml') }}

    - name: Build the task binary
      if: ${{ inputs.initial_setup == 'true' }}
      shell: bash
      run: |
        task_bin="${{ steps.task-bin.outputs.dir }}/task"
        if [[ -x "${task_bin}" ]]; then
          echo "Reusing the cached task binary."
          exit 0
        fi
        mkdir -p "${{ steps.task-bin.outputs.dir }}"
        cp "$(./scripts/run_tool.sh -n task)" "${task_bin}"
        chmod +x "${task_bin}"

    # Putting task on PATH also keeps run_task.sh off its go fallback, which
    # has to build task with GOWORK=off. A miss is not fatal; the fallback
    # still works.
    - name: Use the cached task binary
      shell: bash
      run: |
        if [[ -x "${{ steps.task-bin.outputs.dir }}/task" ]]; then
          echo "${{ steps.task-bin.outputs.dir }}" >> "$GITHUB_PATH"
        else
          echo "No cached task binary; run_task.sh will build one."
        fi

    # The setup job is meant to leave every module a consumer needs in
    # GOMODCACHE. GOPROXY=off turns a miss into an immediate failure naming the
    # module, instead of a silent download that hides an incomplete setup job
    # and pays the download cost in every consumer. Jobs that legitimately
    # resolve new module versions (for example `go mod tidy`) set
    # allow_dependency_download.
    - name: Require cached dependencies
      if: ${{ inputs.initial_setup != 'true' && inputs.allow_dependency_download != 'true' }}
      shell: bash
      run: echo 'GOPROXY=off' >> "$GITHUB_ENV"

    - name: Validate build-cache inputs
      if: ${{ inputs.cache_build_results == 'true' && inputs.build_cache_scope == '' }}
      shell: bash
      run: |
        echo 'build_cache_scope is required when cache_build_results is true' >&2
        exit 1

    # Scheduled race/shuffle callers leave cache_build_results false. Only
    # cacheable pre-merge jobs restore and save test results.
    - name: Restore and save Go build and test results
      if: ${{ inputs.cache_build_results == 'true' }}
      uses: actions/cache@v5
      with:
        path: ${{ steps.go-cache-paths.outputs.build }}
        key: go-build-${{ inputs.build_cache_scope }}-${{ inputs.platform_name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ inputs.build_cache_scope }}-${{ inputs.platform_name }}-${{ runner.os }}-${{ runner.arch }}-
