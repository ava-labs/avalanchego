name: 'Use E2E CI artifacts'
description: 'Restore the prebuilt task and Go E2E test artifacts'

inputs:
  task_artifact_name:
    required: true
  e2e_artifact_name:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v6
      with:
        name: ${{ inputs.task_artifact_name }}
        path: ${{ runner.temp }}/ci-task
    - name: Install prebuilt task
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/avalanchego/tool-bin"
        tar -xzf "${{ runner.temp }}/ci-task/ci-task.tar.gz" -C "$HOME/.cache/avalanchego/tool-bin"
        echo "$HOME/.cache/avalanchego/tool-bin" >> "$GITHUB_PATH"
    - uses: actions/download-artifact@v6
      with:
        name: ${{ inputs.e2e_artifact_name }}
        path: ${{ runner.temp }}/e2e
    - name: Install prebuilt E2E binaries
      shell: bash
      run: |
        tar -xzf "${{ runner.temp }}/e2e/e2e-binaries.tar.gz" -C "$GITHUB_WORKSPACE"
        ./scripts/setup_xsvm_plugin.sh
