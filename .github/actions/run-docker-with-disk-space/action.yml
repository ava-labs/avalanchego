name: 'Run Docker/image command with disk-space protection'
description: 'Ensure runner disk space, run a Docker/image-building command, and log Docker disk diagnostics on failure'

inputs:
  run:
    description: 'Command to run'
    required: true
  working_directory:
    description: 'Working directory to run the command in'
    required: false
    default: '.'
  preserve-docker-images:
    description: 'Whether disk cleanup must keep Docker images prepared by an earlier step'
    required: false
    default: 'false'
  setup-qemu:
    description: 'Whether to set up QEMU before running the command'
    required: false
    default: 'false'
  binfmt-image:
    description: 'Digest-pinned multi-platform binfmt image for Linux Docker hosts'
    required: false
    # Pin the image index so Docker selects the native installer on each host.
    default: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  docker-username:
    description: 'Docker Hub username for a binfmt cache miss'
    required: false
  docker-password:
    description: 'Docker Hub password for a binfmt cache miss'
    required: false

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      if: ${{ inputs.docker-username != '' && inputs.docker-password != '' }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    - uses: ./.github/actions/ensure-disk-space
      with:
        diagnostic-groups: docker
        remove-docker-images: ${{ inputs.preserve-docker-images != 'true' }}

    # Ensure golang is installed after tool cache removal by ensure-disk-space
    - uses: ./.github/actions/setup-go-for-project

    - id: binfmt-image
      if: ${{ inputs.setup-qemu == 'true' }}
      shell: bash
      env:
        BINFMT_IMAGE: ${{ inputs.binfmt-image }}
      run: |
        cache_key="binfmt-v1-${BINFMT_IMAGE#*@sha256:}-${RUNNER_OS}-${RUNNER_ARCH}"
        {
          echo "image=$BINFMT_IMAGE"
          echo "cache-key=$cache_key"
        } >> "$GITHUB_OUTPUT"

    - name: Restore binfmt image
      id: restore-binfmt-image
      if: ${{ inputs.setup-qemu == 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/avalanchego/binfmt
        key: ${{ steps.binfmt-image.outputs.cache-key }}

    - id: cache-policy
      uses: ./.github/actions/cache-policy
      with:
        request-cache-save: ${{ inputs.setup-qemu == 'true' && steps.restore-binfmt-image.outputs.cache-hit != 'true' }}

    - name: Set up QEMU (required for cross-platform builds)
      if: ${{ inputs.setup-qemu == 'true' }}
      shell: bash
      env:
        BINFMT_CACHE_HIT: ${{ steps.restore-binfmt-image.outputs.cache-hit }}
        BINFMT_IMAGE: ${{ steps.binfmt-image.outputs.image }}
        CACHE_BINFMT_IMAGE: ${{ steps.cache-policy.outputs.cache-save-allowed }}
      run: bash "$GITHUB_ACTION_PATH/setup-qemu.sh"

    - name: Cache binfmt image
      if: ${{ steps.cache-policy.outputs.cache-save-allowed == 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/avalanchego/binfmt
        key: ${{ steps.binfmt-image.outputs.cache-key }}

    - name: Run command with Docker failure diagnostics
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        RUN_COMMAND: ${{ inputs.run }}
      run: |
        repo_root="$(git rev-parse --show-toplevel)"

        set +e
        bash -eo pipefail -c "$RUN_COMMAND"
        status=$?
        set -e

        if (( status != 0 )); then
          "$repo_root"/scripts/run_task.sh log-ci-disk-state-docker
        fi

        exit "$status"
