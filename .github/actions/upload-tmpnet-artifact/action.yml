name: 'Upload an artifact of tmpnet data'
description: 'Upload an artifact of data in the ~/.tmpnet path'

inputs:
  name:
    description: "the name of the artifact to upload"
    required: true

runs:
  using: composite
  steps:
    # A missing ~/.tmpnet means tmpnet never started, e.g. the build failed.
    # There is nothing to collect, and that is not the failure to report.
    - name: Check for tmpnet data
      id: tmpnet
      shell: bash
      run: |
        if [[ -d ~/.tmpnet ]]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload tmpnet data
      if: steps.tmpnet.outputs.exists == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: |
          ~/.tmpnet/networks
          ~/.tmpnet/prometheus/prometheus.log
          ~/.tmpnet/promtail/promtail.log
        if-no-files-found: error
