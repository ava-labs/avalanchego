name: 'Install nix'
description: 'Install nix and load the repo flake dependencies into the store'

inputs:
  github_token:
    description: "github token to authenticate with to avoid being rate-limited"
    default: ${{ github.token }}
    required: false
  disable_go_proxy:
    description: 'Disable GOPROXY after Go module-cache preparation'
    default: 'true'
    required: false
  setup_go_module_cache:
    description: 'Restore and prepare the shared Go module cache'
    default: 'true'
    required: false
  request_nix_cache_save:
    description: 'Request a Nix store cache save when cache policy permits it'
    default: 'false'
    required: false

runs:
  using: composite
  steps:
    - id: cache-policy
      uses: ./.github/actions/cache-policy
      with:
        request-cache-save: ${{ inputs.request_nix_cache_save }}

    - uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
      with:
        github_access_token: ${{ inputs.github_token }}
    # Cache the Nix store on Linux and macOS so jobs do not need to fetch the
    # same flake inputs on every run. Key by OS, arch, and flake.lock so the
    # cache is reused across matching runners and replaced when inputs change.
    # Cap the saved store size to keep cache growth bounded.
    - name: Restore and save Nix store cache
      if: runner.os == 'Linux' || runner.os == 'macOS'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: |
          nix-${{ runner.os }}-${{ runner.arch }}-
        save: ${{ steps.cache-policy.outputs.cache-save-allowed == 'true' }}
        gc-max-store-size-linux: 5G
        gc-max-store-size-macos: 5G
    - name: Load flake dependencies
      run: nix develop --command echo "dependencies installed"
      shell: bash
    # This action is a restore-only consumer. The dedicated Go workflow setup
    # jobs own Go module-cache writes.
    - uses: ./.github/actions/setup-go-module-cache
      if: ${{ inputs.setup_go_module_cache == 'true' }}
      with:
        use-nix: 'true'
        request-cache-save: 'false'
        disable-go-proxy: ${{ inputs.disable_go_proxy }}
