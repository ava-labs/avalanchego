name: 'Install nix'
description: 'Install nix and load the repo flake dependencies into the store'

inputs:
  github_token:
    description: "github token to authenticate with to avoid being rate-limited"
    default: ${{ github.token }}
    required: false

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
      with:
        github_access_token: ${{ inputs.github_token }}
    # Cache the Nix store on Linux and macOS so jobs do not need to fetch the
    # same flake inputs on every run. Key by OS, arch, and flake.lock so the
    # cache is reused across matching runners and replaced when inputs change.
    # Cap the saved store size to keep cache growth bounded.
    - name: Restore Nix store cache
      if: runner.os == 'Linux' || runner.os == 'macOS'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: |
          nix-${{ runner.os }}-${{ runner.arch }}-
        save: ${{ github.ref == 'refs/heads/master' }}
        gc-max-store-size-linux: 5G
        gc-max-store-size-macos: 5G
    - name: Load flake dependencies
      run: nix develop --command echo "dependencies installed"
      shell: bash
    - id: go-mod-cache-path
      name: Read Go module cache path
      run: echo "path=$(nix develop --command go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: go-mod-cache
      name: Restore Go module cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.go-mod-cache-path.outputs.path }}
        key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.work', 'go.work.sum', '**/go.mod', '**/go.sum') }}
        restore-keys: |
          go-mod-v2-${{ runner.os }}-
    # Scheduled runs must prove that the exact restored archive has every
    # dependency. Other runs can warm a missing cache entry.
    - name: Disable the Go module proxy for validation
      if: ${{ github.event_name == 'schedule' }}
      shell: bash
      run: echo 'GOPROXY=off' >> "$GITHUB_ENV"
    - name: Prepare Go module dependencies
      run: nix develop --command ./scripts/download_go_modules.sh
      shell: bash
    - name: Save Go module cache
      if: ${{ steps.go-mod-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.go-mod-cache-path.outputs.path }}
        key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.work', 'go.work.sum', '**/go.mod', '**/go.sum') }}
    - name: Disable the Go module proxy
      shell: bash
      run: echo 'GOPROXY=off' >> "$GITHUB_ENV"
