name: 'Install nix'
description: 'Install nix and load the repo flake dependencies into the store'

inputs:
  github_token:
    description: "github token to authenticate with to avoid being rate-limited"
    default: ${{ github.token }}
    required: false
  cache_go:
    description: 'Restore and save the standalone Nix job Go caches'
    default: 'true'
    required: false

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
      with:
        github_access_token: ${{ inputs.github_token }}
    # Cache the Nix store on Linux and macOS so jobs do not need to fetch the
    # same flake inputs on every run. Key by OS, arch, and flake.lock so the
    # cache is reused across matching runners and replaced when inputs change.
    # Cap the saved store size to keep cache growth bounded.
    - name: Restore and save Nix store cache
      if: runner.os == 'Linux' || runner.os == 'macOS'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: |
          nix-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-linux: 5G
        gc-max-store-size-macos: 5G
    - name: Load flake dependencies
      run: nix develop --command echo "dependencies installed"
      shell: bash
    # Cache Go modules (architecture-independent)
    - uses: actions/cache@v5
      if: ${{ inputs.cache_go == 'true' }}
      id: go-mod-cache
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-${{ hashFiles('go.work.sum', 'tools/external/go.sum') }}
        restore-keys: ${{ runner.os }}-go-mod-
    # Cache Go build cache (architecture-specific)
    - uses: actions/cache@v5
      if: ${{ inputs.cache_go == 'true' }}
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('go.work.sum', 'tools/external/go.sum') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-build-
    # Download modules only on cache miss.
    #
    # `go mod download` rewrites go.work.sum and the member go.sum files. These
    # steps only warm the module cache, so restore the checked-in checksums
    # afterwards. A dirty tree breaks any later step that switches branches,
    # which is how the C-Chain benchmark jobs publish to gh-pages. `git -C` is
    # used because a job may set a working-directory inside a submodule.
    - run: |
        nix develop --command go mod download
        git -C "${GITHUB_WORKSPACE}" checkout -- '*.sum'
      if: ${{ inputs.cache_go == 'true' && steps.go-mod-cache.outputs.cache-hit != 'true' }}
      shell: bash
    - run: |
        GOWORK=off nix develop --command go mod download -modfile=tools/external/go.mod
        git -C "${GITHUB_WORKSPACE}" checkout -- '*.sum'
      if: ${{ inputs.cache_go == 'true' && steps.go-mod-cache.outputs.cache-hit != 'true' }}
      shell: bash
