name: Add team items to project boards
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  route_team_items:
    runs-on: ubuntu-24.04
    permissions:
      issues: write # Required for GITHUB_TOKEN to add the evm label to issues
      pull-requests: write # Required for GITHUB_TOKEN to add the evm label to PRs
    steps:
      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TEAM_BOARDS_APP_ID }}
          private-key: ${{ secrets.TEAM_BOARDS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Determine author team membership
        id: membership
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          AUTHOR: ${{ github.event.sender.login }}
        run: |
          # 404 means not a member while anything else is a real error.
          is_active_member() {
            local out
            if out=$(gh api "orgs/ava-labs/teams/$1/memberships/$AUTHOR" --jq '.state == "active"' 2>&1); then
              echo "$out"
            elif [[ "$out" == *"HTTP 404"* ]]; then
              echo false
            else
              echo "::error::checking $1 membership: $out" >&2
              return 1
            fi
          }
          avalanchego=$(is_active_member platform-avalanchego)
          evm=$(is_active_member platform-evm)
          {
            echo "avalanchego=$avalanchego"
            echo "evm=$evm"
          } >> "$GITHUB_OUTPUT"

      - name: Add to avalanchego board
        if: steps.membership.outputs.avalanchego == 'true'
        uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/ava-labs/projects/23
          github-token: ${{ steps.token.outputs.token }}

      - name: Add evm label
        if: steps.membership.outputs.evm == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels" -f "labels[]=evm"

      - name: Add to EVM Team Board
        if: steps.membership.outputs.evm == 'true'
        uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/ava-labs/projects/36
          github-token: ${{ steps.token.outputs.token }}
