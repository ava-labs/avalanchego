name: Bazel

# Keep this workflow separate from bazel-pull-request.yml.
# This makes bazel-required wait for the shared test workflows.
# Top-level Bazel CI entrypoint for pre-merge checks. Full Ubuntu tests and
# macOS smoke tests use separate reusable workflows so this workflow has no
# irrelevant skipped jobs.
on:
  push:
    tags:
      - "*"
    branches:
      - master
      - dev
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Cancel ongoing workflow runs if a new one is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-e2e:
    name: linux-amd64
    uses: ./.github/workflows/bazel.yml
    with:
      platform_name: linux-amd64
      runner: ubuntu-24.04
      run_race_shuffle_unit_tests: false
    secrets: inherit

  smoke:
    name: darwin-arm64
    uses: ./.github/workflows/bazel-smoke.yml
    with:
      platform_name: darwin-arm64
      runner: macos-26
    secrets: inherit

  darwin-arm64-required:
    name: darwin-arm64 / bazel-required
    if: ${{ always() }}
    needs: smoke
    # This job checks results, not macOS behavior.
    # Linux runners start faster and fail less often than macOS runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless all needed jobs succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | .key
            ' <<<"$NEEDS_JSON"
          )"

          if [[ -n "$failed_jobs" ]]; then
            echo "Required jobs failed:"
            printf '%s\n' "$failed_jobs"
            exit 1
          fi

  linux-amd64-required:
    name: linux-amd64 / bazel-required
    if: ${{ always() }}
    needs: unit-and-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless all needed jobs succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | .key
            ' <<<"$NEEDS_JSON"
          )"

          if [[ -n "$failed_jobs" ]]; then
            echo "Required jobs failed:"
            printf '%s\n' "$failed_jobs"
            exit 1
          fi
