name: Go Full Test Jobs

# Reusable workflow for running Go tests with configurable race/shuffle
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      run_race_shuffle_unit_tests:
        description: 'Run unit tests with race detection and shuffled test order'
        required: false
        type: boolean
        default: false
      clear_unit_test_results:
        description: 'Clear restored Go test results before running tests'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  unit:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - id: setup-go
        uses: ./.github/actions/setup-go-for-project
      - id: cache-policy
        uses: ./.github/actions/cache-policy
        with:
          request-cache-save: 'true'
      # Git assigns fresh fixture mtimes on each checkout. Normalize them before
      # restoring GOCACHE so Go can reuse test results from another runner.
      - name: Normalize testdata modification times
        shell: bash
        run: ./scripts/run_task.sh normalize-testdata-mtimes
      - id: cache-key
        name: Determine Go unit-test cache key
        shell: bash
        run: |
          set -euo pipefail
          # Separate scheduled build entries from entries whose test results
          # must be complete on an exact restore. Runner labels distinguish OS versions.
          cache_mode=${{ inputs.clear_unit_test_results && 'build' || 'build-and-test' }}
          cache_key_platform_prefix="go-unit-${{ inputs.runner }}-${{ runner.arch }}-"
          cache_key_prefix="${cache_key_platform_prefix}${cache_mode}-"
          cache_key="${cache_key_prefix}$(./scripts/workflow-hash-go-unit-inputs.sh)"
          {
            echo "cache-key=${cache_key}"
            echo "cache-key-prefix=${cache_key_prefix}"
            echo "cache-key-platform-prefix=${cache_key_platform_prefix}"
          } >> "$GITHUB_OUTPUT"
      - id: unit-cache
        name: Restore Go unit-test cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ steps.cache-key.outputs.cache-key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.cache-key-prefix }}
            ${{ steps.cache-key.outputs.cache-key-platform-prefix }}
      # Preserve reusable test results on fallbacks with unchanged fixtures.
      # Scheduled jobs still rerun every test, including after exact hits.
      - name: Prepare restored Go unit cache
        shell: bash
        env:
          GO_BUILD_CACHE: ${{ steps.setup-go.outputs.go-build-cache-path }}
          FIXTURE_HASH: ${{ hashFiles('**/testdata/**') }}
          CLEAR_TEST_RESULTS: ${{ inputs.clear_unit_test_results }}
          MATCHED_KEY: ${{ steps.unit-cache.outputs.cache-matched-key }}
        run: ./scripts/workflow-prepare-go-unit-cache.sh "$GO_BUILD_CACHE" "$FIXTURE_HASH" "$CLEAR_TEST_RESULTS" "$MATCHED_KEY"
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run_task.sh ${{ inputs.run_race_shuffle_unit_tests && 'test-unit-race-shuffle' || 'test-unit' }} 2>&1 | tee "$RUNNER_TEMP/go-unit-test.log"
        env:
          TIMEOUT: 900s
      - name: Validate restored unit-test results
        # Race-and-shuffle tests intentionally bypass Go test-result caching.
        if: ${{ !inputs.clear_unit_test_results && steps.unit-cache.outputs.cache-hit == 'true' && !inputs.run_race_shuffle_unit_tests }}
        shell: bash
        run: ./scripts/workflow-validate-go-unit-cache.sh "$RUNNER_TEMP/go-unit-test.log"
      # Expire scheduled test results before saving; retain compiled output.
      - name: Clear scheduled test results before saving
        if: ${{ inputs.clear_unit_test_results && steps.cache-policy.outputs.cache-save-allowed == 'true' && steps.unit-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: go clean -testcache
      - name: Save Go unit-test cache
        if: ${{ steps.cache-policy.outputs.cache-save-allowed == 'true' && steps.unit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ steps.cache-key.outputs.cache-key }}
