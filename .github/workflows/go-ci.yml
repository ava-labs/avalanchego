name: Go Full Test Jobs

# Reusable workflow for running Go tests with configurable race/shuffle
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      run_race_shuffle_unit_tests:
        description: 'Run unit tests with race detection and shuffled test order'
        required: false
        type: boolean
        default: false
      cache_validation:
        description: 'Enable PR-scoped Go cache validation'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  setup:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-dependencies
        with:
          cache-validation: ${{ inputs.cache_validation }}

  unit:
    needs: setup
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Normalize testdata modification times
        shell: bash
        run: ./scripts/run_task.sh normalize-testdata-mtimes
      - id: setup-go
        uses: ./.github/actions/setup-go-for-project
        with:
          cache-validation: ${{ inputs.cache_validation }}
      - id: unit-cache
        name: Restore Go unit-test cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('**/testdata/**')) || format('go-unit-{0}-{1}-{2}-{3}', runner.os, runner.arch, hashFiles('**/testdata/**'), hashFiles('**/*.go', 'go.work.sum', '**/go.mod', '**/go.sum')) }}
          restore-keys: |
            ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}-', runner.os, runner.arch) || format('go-unit-{0}-{1}-{2}-', runner.os, runner.arch, hashFiles('**/testdata/**')) }}
            ${{ !inputs.cache_validation && format('go-unit-{0}-{1}-', runner.os, runner.arch) || '' }}
      # A fallback with changed fixtures may have test results keyed by the
      # same fixed testdata mtimes. Keep its build cache, not its test results.
      - name: Clear test results from a changed-fixture cache
        if: ${{ steps.unit-cache.outputs.cache-matched-key != '' && (inputs.cache_validation && !startsWith(steps.unit-cache.outputs.cache-matched-key, format('go-unit-validation-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('**/testdata/**'))) || (!inputs.cache_validation && !startsWith(steps.unit-cache.outputs.cache-matched-key, format('go-unit-{0}-{1}-{2}-', runner.os, runner.arch, hashFiles('**/testdata/**'))))) }}
        shell: bash
        run: go clean -testcache
      - name: Record Go cache restore results
        shell: bash
        run: |
          {
            echo "task-cache-hit=${{ steps.setup-go.outputs.task-cache-hit }}"
            echo "go-mod-cache-hit=${{ steps.setup-go.outputs.go-mod-cache-hit }}"
            echo "go-unit-cache-hit=${{ steps.unit-cache.outputs.cache-hit }}"
          } > "$RUNNER_TEMP/go-unit-cache-validation.log"
      # actions/cache saves in its post step after successful warm jobs.
      - name: Save Go unit-test cache
        if: ${{ (github.ref == 'refs/heads/master' || inputs.cache_validation) && steps.unit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('**/testdata/**')) || format('go-unit-{0}-{1}-{2}-{3}', runner.os, runner.arch, hashFiles('**/testdata/**'), hashFiles('**/*.go', 'go.work.sum', '**/go.mod', '**/go.sum')) }}
          restore-keys: |
            ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}-', runner.os, runner.arch) || format('go-unit-{0}-{1}-{2}-', runner.os, runner.arch, hashFiles('**/testdata/**')) }}
            ${{ !inputs.cache_validation && format('go-unit-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run_task.sh ${{ inputs.run_race_shuffle_unit_tests && 'test-unit-race-shuffle' || 'test-unit' }} 2>&1 | tee -a "$RUNNER_TEMP/go-unit-cache-validation.log"
        env:
          # GODEBUG is a Go test-cache input. Warm and validation runs must match.
          GODEBUG: ${{ (github.ref == 'refs/heads/master' || inputs.cache_validation) && 'gocachetest=1' || '' }}
          GOPROXY: ${{ (github.ref == 'refs/heads/master' || (inputs.cache_validation && steps.unit-cache.outputs.cache-hit == 'true')) && 'off' || '' }}
          TIMEOUT: 900s
      - name: Validate Go cache restores
        if: ${{ always() && (github.ref == 'refs/heads/master' || (inputs.cache_validation && steps.unit-cache.outputs.cache-hit == 'true')) }}
        shell: bash
        run: |
          go run ./tools/cache-check \
            --check task-cache-restore \
            --check go-mod-cache-restore \
            --check go-unit-cache-restore \
            --log "$RUNNER_TEMP/go-unit-cache-validation.log"
      - name: Validate Go unit-test results
        # Race-and-shuffle jobs reuse compiler output but intentionally bypass
        # Go test-result caching.
        if: ${{ always() && !inputs.run_race_shuffle_unit_tests && (github.ref == 'refs/heads/master' || (inputs.cache_validation && steps.unit-cache.outputs.cache-hit == 'true')) }}
        shell: bash
        run: |
          go run ./tools/cache-check \
            --check go-unit-test-results \
            ${{ inputs.cache_validation && '--allow-uncached-go-test-package github.com/ava-labs/avalanchego/tools/cache-check' || '' }} \
            --log "$RUNNER_TEMP/go-unit-cache-validation.log"
