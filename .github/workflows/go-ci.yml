name: Go Full Test Jobs

# Reusable workflow for running Go tests with configurable race/shuffle
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      run_race_shuffle_unit_tests:
        description: 'Run unit tests with race detection and shuffled test order'
        required: false
        type: boolean
        default: false
      cache_validation:
        description: 'Enable PR-scoped Go unit-cache validation'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  setup:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-dependencies

  unit:
    needs: setup
    runs-on: ${{ inputs.runner }}
    cache-mode: ${{ (inputs.cache_validation || github.ref == 'refs/heads/master') && 'write' || 'read' }}
    steps:
      - uses: actions/checkout@v5
      - id: setup-go
        uses: ./.github/actions/setup-go-for-project
      # A validation run uses one fixed key in its PR merge-ref scope. Its first
      # attempt removes that key so later pushes do not accumulate entries.
      - name: Clear Go unit-test validation cache
        if: ${{ inputs.cache_validation && github.run_attempt == 1 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${GITHUB_REF//\//%2F}"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/actions/caches?key=go-unit-validation-${RUNNER_OS}-${RUNNER_ARCH}&ref=${ref}"
      - id: unit-cache
        name: Restore Go unit-test cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}', runner.os, runner.arch) || format('go-unit-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('**/*.go', 'go.work.sum', '**/go.mod', '**/go.sum')) }}
          restore-keys: |
            ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}', runner.os, runner.arch) || format('go-unit-{0}-{1}-', runner.os, runner.arch) }}
      - name: Record Go unit-test cache restore result
        shell: bash
        run: echo "go-unit-cache-hit=${{ steps.unit-cache.outputs.cache-hit }}" > "$RUNNER_TEMP/go-unit-cache-validation.log"
      # actions/cache saves in its post step, after the unit tests complete.
      # Validation runs save only to their PR merge-ref scope.
      - name: Save Go unit-test cache
        if: ${{ (github.ref == 'refs/heads/master' || inputs.cache_validation) && steps.unit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}', runner.os, runner.arch) || format('go-unit-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('**/*.go', 'go.work.sum', '**/go.mod', '**/go.sum')) }}
          restore-keys: |
            ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}', runner.os, runner.arch) || format('go-unit-{0}-{1}-', runner.os, runner.arch) }}
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run_task.sh ${{ inputs.run_race_shuffle_unit_tests && 'test-unit-race-shuffle' || 'test-unit' }} 2>&1 | tee -a "$RUNNER_TEMP/go-unit-cache-validation.log"
        env:
          GOPROXY: ${{ github.ref == 'refs/heads/master' && 'off' || '' }}
          TIMEOUT: 900s
      - name: Validate Go unit-test cache
        if: ${{ always() && inputs.cache_validation }}
        shell: bash
        run: |
          go run ./tools/cache-check \
            --check go-unit-cache-restore \
            --check go-unit-test-results \
            --log "$RUNNER_TEMP/go-unit-cache-validation.log"
