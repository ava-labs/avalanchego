name: Go Full Test Jobs

# Reusable workflow for running Go tests with configurable race/shuffle
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      run_race_shuffle_unit_tests:
        description: 'Run unit tests with race detection and shuffled test order'
        required: false
        type: boolean
        default: false
      cache_validation:
        description: 'Enable PR-scoped Go cache validation'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  setup:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
      # Validation keys are fixed to bound PR cache storage. Clear prior entries
      # before each new attempt so the run can warm entries for its revision.
      - name: Clear Go validation caches
        if: ${{ inputs.cache_validation && github.run_attempt == 1 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keys=(
            "task-validation-${RUNNER_OS}-${RUNNER_ARCH}"
            "go-mod-validation-${RUNNER_OS}"
            "go-unit-validation-${RUNNER_OS}-${RUNNER_ARCH}"
          )
          for key in "${keys[@]}"; do
            cache_ids="$(gh cache list --ref "$GITHUB_REF" --key "$key" --limit 100 --json id --jq '.[].id')"
            for cache_id in $cache_ids; do
              gh cache delete "$cache_id"
            done
          done
      - uses: ./.github/actions/setup-go-dependencies
        with:
          cache-validation: ${{ inputs.cache_validation }}

  unit:
    needs: setup
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - id: setup-go
        uses: ./.github/actions/setup-go-for-project
        with:
          cache-validation: ${{ inputs.cache_validation }}
      - id: unit-cache
        name: Restore Go unit-test cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}', runner.os, runner.arch) || format('go-unit-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('**/*.go', 'go.work.sum', '**/go.mod', '**/go.sum')) }}
          restore-keys: |
            ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}', runner.os, runner.arch) || format('go-unit-{0}-{1}-', runner.os, runner.arch) }}
      - name: Record Go cache restore results
        shell: bash
        run: |
          {
            echo "task-cache-hit=${{ steps.setup-go.outputs.task-cache-hit }}"
            echo "go-mod-cache-hit=${{ steps.setup-go.outputs.go-mod-cache-hit }}"
            echo "go-unit-cache-hit=${{ steps.unit-cache.outputs.cache-hit }}"
          } > "$RUNNER_TEMP/go-unit-cache-validation.log"
      # actions/cache saves in its post step, after the unit tests complete.
      # Validation runs save only to their PR merge-ref scope.
      - name: Save Go unit-test cache
        if: ${{ (github.ref == 'refs/heads/master' || inputs.cache_validation) && steps.unit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}', runner.os, runner.arch) || format('go-unit-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('**/*.go', 'go.work.sum', '**/go.mod', '**/go.sum')) }}
          restore-keys: |
            ${{ inputs.cache_validation && format('go-unit-validation-{0}-{1}', runner.os, runner.arch) || format('go-unit-{0}-{1}-', runner.os, runner.arch) }}
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run_task.sh ${{ inputs.run_race_shuffle_unit_tests && 'test-unit-race-shuffle' || 'test-unit' }} 2>&1 | tee -a "$RUNNER_TEMP/go-unit-cache-validation.log"
        env:
          GOPROXY: ${{ github.ref == 'refs/heads/master' && 'off' || '' }}
          TIMEOUT: 900s
      - name: Validate Go unit-test cache
        if: ${{ always() && inputs.cache_validation }}
        shell: bash
        run: |
          go run ./tools/cache-check \
            --check task-cache-restore \
            --check go-mod-cache-restore \
            --check go-unit-cache-restore \
            --check go-unit-test-results \
            --log "$RUNNER_TEMP/go-unit-cache-validation.log"
