name: Go

# Keep this workflow separate from go-pull-request.yml.
# This makes go-required wait for the shared test workflow.
on:
  push:
    tags:
      - "*"
    branches:
      - master
      - dev
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Cancel ongoing workflow runs if a new one is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-required:
    if: ${{ always() }}
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless all needed jobs succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | .key
            ' <<<"$NEEDS_JSON"
          )"

          if [[ -n "$failed_jobs" ]]; then
            echo "Required jobs failed:"
            printf '%s\n' "$failed_jobs"
            exit 1
          fi

  tests:
    uses: ./.github/workflows/go.yml
    secrets: inherit
