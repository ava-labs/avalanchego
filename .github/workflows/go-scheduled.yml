name: Scheduled Go

# Full platform coverage runs separately from pre-merge Go CI
on:
  # Allow a maintainer to trigger this workflow against a PR branch. This can verify
  # the correctness of changes that affect this workflow before those changes are
  # merged.
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # Runs every day at 09:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep setup jobs separate rather than using a matrix so each consumer waits
  # only for the setup job for its platform.

  setup-cache-darwin-arm64:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-workflow-cache-producer

  setup-cache-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-workflow-cache-producer

  setup-cache-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-workflow-cache-producer
        with:
          # The Linux AMD64 setup job produces the Go module cache shared by all Linux
          # architectures. This job still produces its platform-specific Task and Nix caches.
          produce-go-module-cache: 'false'

  e2e:
    name: e2e (ubuntu-24.04-amd64, race, serial)
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-for-project
      - id: cache-policy
        uses: ./.github/actions/cache-policy
        with:
          request-cache-save: 'true'
      - id: cache-key
        name: Determine Go E2E race build-cache key
        shell: bash
        run: |
          cache_key_prefix="go-e2e-ubuntu-24.04-${{ runner.arch }}-race-"
          cache_path="$(go env GOCACHE)"
          input_hash="$(./scripts/workflow-hash-go-e2e-inputs.sh)"
          {
            echo "go-build-cache-path=${cache_path}"
            echo "cache-key=${cache_key_prefix}${input_hash}"
            echo "cache-key-prefix=${cache_key_prefix}"
          } >> "$GITHUB_OUTPUT"
      - id: e2e-cache
        name: Restore Go E2E race build cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-key.outputs.go-build-cache-path }}
          key: ${{ steps.cache-key.outputs.cache-key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.cache-key-prefix }}
      - id: validate-e2e-cache
        name: Validate exact Go E2E race build-cache hit
        if: ${{ steps.e2e-cache.outputs.cache-hit == 'true' }}
        uses: ./.github/actions/validate-go-e2e-cache
        with:
          mode: race
          setup_go_module_cache: 'false'
      - name: Run Go E2E tests serially with race detection
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: ./scripts/run_task.sh test-e2e-race-serial
          nix_setup_complete: ${{ steps.validate-e2e-cache.outcome == 'success' }}
          setup_go_module_cache: 'false'
          artifact_prefix: e2e-ubuntu-24.04-amd64-race-serial
          filter_by_owner: avalanchego-e2e
          prometheus_url: ${{ secrets.PROMETHEUS_URL || '' }}
          prometheus_push_url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_url: ${{ secrets.LOKI_URL || '' }}
          loki_push_url: ${{ secrets.LOKI_PUSH_URL || '' }}
          loki_username: ${{ secrets.LOKI_USERNAME || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}
      - name: Save Go E2E race build cache
        if: ${{ steps.cache-policy.outputs.cache-save-allowed == 'true' && steps.e2e-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache-key.outputs.go-build-cache-path }}
          key: ${{ steps.cache-key.outputs.cache-key }}

  full-darwin-arm64:
    name: macos-26-arm64
    needs: setup-cache-darwin-arm64
    uses: ./.github/workflows/go-unit.yml
    with:
      runner: macos-26
      test_task: test-unit
    secrets: inherit

  full-linux-amd64:
    name: ${{ matrix.platform_name }}
    needs: setup-cache-linux-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: ubuntu-22.04-amd64
            runner: ubuntu-22.04
            test_task: test-unit
          # Run race and shuffled tests once on our production platform to retain coverage
          # without increasing flake rate across every platform.
          - platform_name: ubuntu-24.04-amd64
            runner: ubuntu-24.04
            test_task: test-unit-race-shuffle
    uses: ./.github/workflows/go-unit.yml
    with:
      runner: ${{ matrix.runner }}
      test_task: ${{ matrix.test_task }}
    secrets: inherit

  full-linux-arm64:
    name: ${{ matrix.platform_name }}
    needs:
      - setup-cache-linux-amd64
      - setup-cache-linux-arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: ubuntu-22.04-arm64
            runner: ubuntu-22.04-arm
          - platform_name: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/go-unit.yml
    with:
      runner: ${{ matrix.runner }}
      test_task: test-unit
    secrets: inherit
