name: Go Smoke Unit Test Jobs

# Reusable workflow for running the Go unit-test smoke suite.
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions: {}

jobs:
  unit-smoke:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-for-project
      - name: Run unit-test smoke suite
        shell: bash
        run: ./scripts/run_task.sh test-unit-smoke
