name: Bazel Smoke Test Jobs

# Reusable Bazel CI workflow for the unit-test and E2E smoke tests.
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string

env:
  BAZEL_CI_ENFORCE_DEPENDENCY_LIST: 1
  BAZEL_REMOTE_CACHE_URL: ${{ secrets.BAZEL_REMOTE_CACHE_URL || '' }}
  BAZEL_REMOTE_CACHE_AUTH_HEADER: ${{ secrets.BAZEL_REMOTE_CACHE_AUTH_HEADER || '' }}

permissions:
  contents: read

jobs:
  # Prepare Bazel CI for this platform before the smoke tests run.
  setup:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bazel
        with:
          is-setup-job: 'true'

  unit-smoke:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run Bazel unit-test smoke test
        uses: ./.github/actions/run-bazel-with-disk-space
        with:
          run: ./scripts/run_task.sh bazel-test-unit-smoke

  e2e-smoke:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Do not use the monitored action here. It installs Nix for Prometheus and Promtail.
      # macOS smoke jobs skip monitoring to limit pre-merge time. Scheduled full E2E jobs retain it.
      - name: Run E2E smoke test with Bazel-built binary
        uses: ./.github/actions/run-bazel-with-disk-space
        with:
          run: ./scripts/run_task.sh bazel-test-e2e-smoke
      - name: Upload tmpnet data
        if: always()
        uses: ./.github/actions/upload-tmpnet-artifact
        with:
          name: e2e-bazel-smoke-${{ inputs.platform_name }}-tmpnet-data
