name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # Keep this as the only CI status required by main's branch protection.
  # To make another job merge-blocking, add its job key to this list. This
  # keeps the required checks version-controlled instead of requiring a
  # corresponding branch-protection update in the GitHub UI.
  tests-required:
    if: ${{ always() }}
    needs:
      - build
      - no-rust-cache-lint
      - rust-lint
      - test
      - examples
      - docs
      - ffi
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all required jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | .key
            ' <<<"$NEEDS_JSON"
          )"

          if [[ -n "$failed_jobs" ]]; then
            echo "Required jobs failed:"
            printf '%s\n' "$failed_jobs"
            exit 1
          fi

  build:
    # To optimize cargo performance and caching throughout the CI pipeline, we use Swatinem/rust-cache
    # and set up an initial build job that writes the cache for a matrix of joint build profiles and
    # feature sets.
    # Future jobs specify the job they "need" (block to ensure the cache has been populated), the shared-key
    # to read the cache and can set save-if: "false" to skip an expensive and unnecessary cache write.
    #
    # GitHub Actions does not provide easy support to define and re-use a matrix across multiple jobs
    # and later jobs may also want to execute with only a subset of this matrix. Therefore, we define
    # the matrix here and later jobs must re-specify the full matrix, a subset, or declare a single
    # shared-key to read the cache.
    strategy:
      # do not cancel concurrent jobs if one fails for exhaustive failure reasons
      fail-fast: false
      matrix:
        include:
          - profile-key: debug-no-default-features
          - profile-key: debug-no-features
          - profile-key: debug-no-features
            os: macos-26
          - profile-key: debug-ethhash-logger
          - profile-key: debug-all-features
          - profile-key: maxperf-ethhash-logger
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2
        with:
          shared-key: ${{ matrix.profile-key }}
          cache-all-crates: true
          cache-workspace-crates: true
      # Require Cargo.lock to be up to date and ensure the registry cache is populated
      - name: Cargo Fetch (run `cargo generate-lockfile` if this fails)
        run: cargo fetch --locked --verbose
      - name: Check
        run: ./scripts/run-just.sh ci-rust check ${{ matrix.profile-key }}
      - name: Build
        run: ./scripts/run-just.sh ci-rust build ${{ matrix.profile-key }}

  no-rust-cache-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check license headers
        uses: viperproject/check-license-header@e06c65614fa9f32e099838df4dd25440c5344b32 # @v2
        with:
          path: .
          config: .github/check-license-headers.yaml
          strict: true
      - name: Format
        run: ./scripts/run-just.sh ci-format
      # Fails on TODO/FIXME markers lacking an owner or issue (see issue #1603).
      - name: Check TODO/FIXME annotations
        run: ./scripts/run-just.sh ci-check-todos

  rust-lint-pr-comments:
    # caveat emptor: actions-rs/clippy-check can only write comments on pull requests
    # not originating from a fork.
    if: github.event_name == 'pull_request' && github.repository == github.event.pull_request.head.repo.full_name
    needs: build
    strategy:
      matrix:
        include:
          - profile-key: debug-no-default-features
          - profile-key: debug-no-features
          - profile-key: debug-no-features
            os: macos-26
          - profile-key: debug-ethhash-logger
          - profile-key: debug-all-features
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: nightly-2026-07-05
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: ${{ matrix.profile-key }}
      - uses: giraffate/clippy-action@13b9d32482f25d29ead141b79e7e04e7900281e0 # @v1 -> v1.0.1
        with:
          reporter: 'github-pr-check'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  rust-lint:
    needs: build
    strategy:
      # do not cancel concurrent jobs if one fails for exhaustive failure reasons
      fail-fast: false
      matrix:
        include:
          - profile-key: debug-no-default-features
          - profile-key: debug-no-features
          - profile-key: debug-no-features
            os: macos-26
          - profile-key: debug-ethhash-logger
          - profile-key: debug-all-features
          - profile-key: maxperf-ethhash-logger
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: nightly-2026-07-05
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: ${{ matrix.profile-key }}
      - name: Clippy
        run: ./scripts/run-just.sh ci-rust clippy ${{ matrix.profile-key }}

  test:
    needs: build
    strategy:
      # do not cancel concurrent jobs if one fails for exhaustive failure reasons
      fail-fast: false
      matrix:
        include:
          - profile-key: debug-no-default-features
          - profile-key: debug-no-features
          - profile-key: debug-no-features
            os: macos-26
          - profile-key: debug-ethhash-logger
          - profile-key: debug-all-features
          - profile-key: maxperf-ethhash-logger
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a7cecc7ff99ae8eda4fc89463cb7ab6aaa619b43 # @nextest
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: ${{ matrix.profile-key }}
      - name: Run tests with cargo-nextest
        run: ./scripts/run-just.sh ci-rust test ${{ matrix.profile-key }}

  examples:
    needs: build
    strategy:
      matrix:
        include:
          - profile-key: debug-no-default-features
          - profile-key: debug-no-features
          - profile-key: debug-no-features
            os: macos-26
          - profile-key: debug-ethhash-logger
          - profile-key: debug-all-features
          - profile-key: maxperf-ethhash-logger
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: ${{ matrix.profile-key }}
      - name: Run benchmark example
        run: ./scripts/run-just.sh ci-rust benchmark-example ${{ matrix.profile-key }}
      - name: Run insert example
        run: ./scripts/run-just.sh ci-rust insert-example ${{ matrix.profile-key }}

  docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: "debug-no-features"
      - name: md check
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # @v23.2.0
      - name: doc generation
        run: ./scripts/run-just.sh ci-docs

  ffi-check-go-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - name: Check `go generate` for changes
        run: ./scripts/run-just.sh ci-check-go-generate

  ffi:
    needs: [build, ffi-check-go-generate]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: "debug-no-features"
      - name: Build Firewood FFI
        working-directory: ffi
        run: ../scripts/run-just.sh ci-build-ffi firewood
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "ffi/go.mod"
          cache-dependency-path: |
            ffi/go.sum
            ffi/tools/external/go.sum
      - name: Run golangci-lint
        run: ./scripts/run-just.sh ci-lint-ffi
      - name: Test Go FFI bindings
        working-directory: ffi
        # cgocheck2 is expensive but provides complete pointer checks
        run: ../scripts/run-just.sh ci-test-ffi firewood

  # Replay recorded C-Chain execution logs against Firewood to catch changes that would break the C-Chain.
  replay-test:
    needs: [build]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cchain-mainnet-250k
            replay-log: s3://firewood-cchain-replay-logs/cchain-mainnet-250k.replay
            expected-root: 69f6e82aa25242787095e7deff07568a3be4496654203ef8c343648c76ecda32
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: "maxperf-ethhash-logger"
      - name: Build Firewood FFI
        run: cargo build --locked -p firewood-ffi --profile maxperf --features ethhash,logger
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "ffi/go.mod"
          cache-dependency-path: ffi/go.sum
      - name: Install s5cmd
        run: go install github.com/peak/s5cmd/v2@v2.3.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # @v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_S3_READ_ONLY_ROLE }}
          aws-region: us-east-2
      - name: Download replay log
        run: s5cmd cp '${{ matrix.replay-log }}' '${{ runner.temp }}/${{ matrix.name }}.replay'
      - name: Run C-Chain replay test
        working-directory: ffi
        env:
          REPLAY_LOG: ${{ runner.temp }}/${{ matrix.name }}.replay
          REPLAY_MAX_COMMITS: "0"
          REPLAY_EXPECTED_ROOT: ${{ matrix.expected-root }}
          TEST_FIREWOOD_HASH_MODE: ethhash
        run: go test -run 'TestReplayLogExecution$' -v -timeout 20m .

  firewood-ethhash-differential-fuzz:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: "debug-ethhash-logger"
      - name: Build Firewood FFI (with ethhash)
        run: ./scripts/run-just.sh ci-build-ffi ethhash
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "ffi/tests/eth/go.mod"
          cache-dependency-path: "ffi/tests/eth/go.sum"
      - name: Test Go FFI bindings
        working-directory: ffi
        # cgocheck2 is expensive but provides complete pointer checks
        run: ../scripts/run-just.sh ci-test-ffi ethhash
      - name: Test Firewood <> Ethereum Differential Fuzz
        working-directory: ffi/tests/eth
        run: |
          # Set memlock to unlimited for the shell invoking the fuzz tests
          ulimit -Sa
          ulimit -Ha
          sudo prlimit --pid $$ --memlock=-1:-1 || echo "prlimit not available, locking kernel memory may fail when setting up io-uring"
          ulimit -Sa
          ulimit -Ha
          go test -race -fuzz=FuzzFirewoodTree -fuzztime=1m
          go test -race -fuzz=FuzzRangeProofCreation -fuzztime=1m
      - name: Upload Fuzz testdata
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ethhash-differential-fuzz-testdata
          path: ffi/tests/eth/testdata
          retention-days: 30

  firewood-merkle-differential-fuzz:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: "debug-no-features"
      - name: Build Firewood FFI
        run: ./scripts/run-just.sh ci-build-ffi firewood
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "ffi/tests/firewood/go.mod"
          cache-dependency-path: "ffi/tests/firewood/go.sum"
      - name: Test Firewood <> MerkleDB Differential fuzz
        working-directory: ffi/tests/firewood
        run: |
          # Set memlock to unlimited for the shell invoking the fuzz tests
          ulimit -Sa
          ulimit -Ha
          sudo prlimit --pid $$ --memlock=-1:-1 || echo "prlimit not available, locking kernel memory may fail when setting up io-uring"
          ulimit -Sa
          ulimit -Ha
          go test -race -fuzz=. -fuzztime=1m
      - name: Upload Fuzz testdata
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firewood-merkle-differential-fuzz-testdata
          path: ffi/tests/firewood/testdata
          retention-days: 30

  stale-deps:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just@1.46.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2 -> v2.9.1
        with:
          save-if: "false"
          shared-key: "debug-no-features"
      - name: Install cargo-machete
        run: cargo install cargo-machete
      - name: Check for stale dependencies
        run: ./scripts/run-just.sh ci-machete

  miri:
    name: miri (path::component slice casts)
    # NB: this uses macos and not linux intentionally. miri fails due to a dependency
    # that uses inline assembly (fastrace → fastant → small_ctor) which is not supported
    # by the Miri interpreter.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # @master
        with:
          toolchain: nightly-2026-07-05
          components: miri
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # @v2
        with:
          shared-key: "miri"
      - name: Miri (slice reinterpret round-trip)
        run: cargo miri test --locked -p firewood-storage path::component
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
