name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - master
      - dev

jobs:
  publish_docker_image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and publish Docker images
        uses: ./.github/actions/run-docker-with-disk-space
        with:
          setup-qemu: 'true'
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASS }}
          run: |
            docker buildx create --use
            DOCKER_IMAGE="$DOCKER_IMAGE_DEFAULT" scripts/run_task.sh build-image
            DOCKER_IMAGE=avaplatform/bootstrap-monitor scripts/run_task.sh build-bootstrap-monitor-image
            IMAGE_NAME=avaplatform/subnet-evm scripts/run_task.sh build-subnet-evm-image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          DOCKER_IMAGE_DEFAULT: ${{ secrets.DOCKER_REPO }}
          BUILD_MULTI_ARCH: 1
          PLATFORMS: "linux/amd64,linux/arm64"
          PUBLISH: 1
