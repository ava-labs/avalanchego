name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      firewood-ref:
        description: 'Firewood branch, tag or commit to build from source. Publishes only an amd64 avalanchego image, tagged with a -firewood-<ref> suffix.'
        default: ''
  push:
    tags:
      - "*"
    branches:
      - master
      - dev

jobs:
  publish_docker_image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # A custom Firewood is built with the same polyrepo flow as the C-Chain
      # re-execution benchmark.
      - name: Provision dependencies for the Firewood build
        if: ${{ inputs.firewood-ref != '' }}
        uses: ./.github/actions/install-nix
        with:
          # The Firewood ref can require modules that are not in the repository cache.
          disable_go_proxy: 'false'
      - name: Build Firewood
        if: ${{ inputs.firewood-ref != '' }}
        shell: nix develop --command bash -x {0}
        run: ./scripts/run_task.sh run-polyrepo
        env:
          FIREWOOD_REF: ${{ inputs.firewood-ref }}
      - name: Copy the Firewood build into the Docker context
        if: ${{ inputs.firewood-ref != '' }}
        # The nix result is a symlink into /nix/store, which Docker won't follow.
        run: |
          cp -rL firewood/ffi/result firewood/ffi/result.copy
          rm firewood/ffi/result
          mv firewood/ffi/result.copy firewood/ffi/result
          chmod -R u+w firewood/ffi/result
      - name: Build and publish Docker images
        uses: ./.github/actions/run-docker-with-disk-space
        with:
          setup-qemu: 'true'
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASS }}
          run: |
            docker buildx create --use
            if [[ -n "$FIREWOOD_REF" ]]; then
              # Firewood's own dependencies may be missing from the restored module cache.
              export GOPROXY=https://proxy.golang.org,direct
              IMAGE_TAG_SUFFIX="-firewood-$(printf '%s' "$FIREWOOD_REF" | tr -c 'A-Za-z0-9_.-' '-')"
              # nix builds Firewood for the runner's architecture only.
              export IMAGE_TAG_SUFFIX PLATFORMS=linux/amd64 SKIP_BUILD_RACE=1
              DOCKER_IMAGE="$DOCKER_IMAGE_DEFAULT" scripts/run_task.sh build-image
              exit 0
            fi
            DOCKER_IMAGE="$DOCKER_IMAGE_DEFAULT" scripts/run_task.sh build-image
            DOCKER_IMAGE=avaplatform/bootstrap-monitor scripts/run_task.sh build-bootstrap-monitor-image
            IMAGE_NAME=avaplatform/subnet-evm scripts/run_task.sh build-subnet-evm-image
        env:
          FIREWOOD_REF: ${{ inputs.firewood-ref }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          DOCKER_IMAGE_DEFAULT: ${{ secrets.DOCKER_REPO }}
          BUILD_MULTI_ARCH: 1
          PLATFORMS: "linux/amd64,linux/arm64"
          PUBLISH: 1
