name: Tests

# Top-level non-Bazel Go CI entrypoint. Full Ubuntu tests and macOS smoke tests
# use separate reusable workflows so this workflow has no irrelevant skipped jobs.
on:
  push:
    tags:
      - "*"
    branches:
      - master
      - dev
  pull_request:
  merge_group:
    types: [checks_requested]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: linux-amd64
    uses: ./.github/workflows/go-ci.yml
    with:
      platform_name: linux-amd64
      runner: ubuntu-24.04
      run_premerge_jobs: true
    secrets: inherit

  smoke:
    name: darwin-arm64
    uses: ./.github/workflows/go-ci-smoke.yml
    with:
      platform_name: darwin-arm64
      runner: macos-26
    secrets: inherit

  # This job needs an OIDC token to assume the read-only AWS role that downloads
  # the benchmark's C-Chain data from S3. Keep it outside go-ci.yml: a reusable
  # workflow cannot elevate its caller's permissions without granting the token
  # to every job in that workflow.
  #
  # GitHub Actions does not allow secrets in a job-level if. When a fork or
  # Dependabot PR does not receive the role, the job runs but skips all steps.
  c-chain-reexecution:
    name: C-Chain re-execution benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      HAS_AWS_S3_READ_ONLY_ROLE: ${{ secrets.AWS_S3_READ_ONLY_ROLE != '' }}
    steps:
      - if: ${{ env.HAS_AWS_S3_READ_ONLY_ROLE == 'true' }}
        uses: actions/checkout@v5
      - if: ${{ env.HAS_AWS_S3_READ_ONLY_ROLE == 'true' }}
        uses: ./.github/actions/setup-go-for-ci
        with:
          platform_name: linux-amd64
          initial_setup: true
      - name: Run C-Chain re-execution benchmark
        if: ${{ env.HAS_AWS_S3_READ_ONLY_ROLE == 'true' }}
        uses: ./.github/actions/c-chain-reexecution-benchmark
        with:
          test: hashdb-101-250k
          runner_type: ubuntu-24.04
          # setup-go-for-ci owns these cache directories for this job.
          manage-go-caches: 'false'
          prometheus-url: ${{ secrets.PROMETHEUS_URL || '' }}
          prometheus-push-url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
          prometheus-username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
          prometheus-password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          push-github-action-benchmark: 'false'
          aws-role: ${{ secrets.AWS_S3_READ_ONLY_ROLE }}
          aws-region: 'us-east-2'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  go-required:
    if: ${{ always() }}
    needs:
      - full
      - smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless both reusable workflows succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_workflows="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | .key + ": " + .value.result
            ' <<<"$NEEDS_JSON"
          )"

          if [[ -n "$failed_workflows" ]]; then
            echo "Required reusable workflows did not succeed:"
            printf '%s\n' "$failed_workflows"
            exit 1
          fi
