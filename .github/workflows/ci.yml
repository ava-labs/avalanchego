name: Tests

# Top-level non-Bazel Go CI entrypoint. Full Ubuntu tests and macOS smoke tests
# use separate reusable workflows so this workflow has no irrelevant skipped jobs.
on:
  push:
    tags:
      - "*"
    branches:
      - master
      - dev
  pull_request:
  merge_group:
    types: [checks_requested]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: linux-amd64
    uses: ./.github/workflows/go-ci.yml
    with:
      platform_name: linux-amd64
      runner: ubuntu-24.04
      run_race_shuffle_unit_tests: false
      run_premerge_jobs: true
    secrets: inherit

  smoke:
    name: darwin-arm64
    uses: ./.github/workflows/go-ci-smoke.yml
    with:
      platform_name: darwin-arm64
      runner: macos-26
    secrets: inherit

  go-required:
    if: ${{ always() }}
    needs:
      - full
      - smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless both reusable workflows succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_workflows="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | .key + ": " + .value.result
            ' <<<"$NEEDS_JSON"
          )"

          if [[ -n "$failed_workflows" ]]; then
            echo "Required reusable workflows did not succeed:"
            printf '%s\n' "$failed_workflows"
            exit 1
          fi
