name: Bazel Full Test Jobs

# Reusable Bazel CI workflow. The pre-merge and scheduled callers select the platform
# and test configuration.
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      run_race_shuffle_unit_tests:
        description: 'Run unit tests with race detection and shuffled test order'
        required: false
        type: boolean
        default: false
      enable_remote_cache:
        description: 'Enable the remote Bazel cache'
        required: false
        type: boolean
        default: true
      setup_timeout_minutes:
        description: 'Timeout for the setup job'
        required: false
        type: number
        default: 10
      unit_timeout_minutes:
        description: 'Timeout for the unit-test job'
        required: false
        type: number
        default: 30
      e2e_timeout_minutes:
        description: 'Timeout for the E2E job'
        required: false
        type: number
        default: 30
      required_timeout_minutes:
        description: 'Timeout for the aggregate required job'
        required: false
        type: number
        default: 5

env:
  BAZEL_CI_ENFORCE_DEPENDENCY_LIST: 1
  BAZEL_REMOTE_CACHE_ENABLED: ${{ inputs.enable_remote_cache }}
  BAZEL_REMOTE_CACHE_URL: ${{ secrets.BAZEL_REMOTE_CACHE_URL || '' }}
  BAZEL_REMOTE_CACHE_AUTH_HEADER: ${{ secrets.BAZEL_REMOTE_CACHE_AUTH_HEADER || '' }}

permissions:
  contents: read

jobs:
  # Aggregate the per-platform Bazel checks into one stable required job.
  bazel-required:
    if: ${{ always() }}
    needs:
      - setup
      - unit
      - build-avalanchego
      - build-e2e-runtime
      - e2e
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.required_timeout_minutes }}
    steps:
      - name: Fail unless all needed jobs succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | .key
            ' <<<"$NEEDS_JSON"
          )"

          if [[ -n "$failed_jobs" ]]; then
            echo "Required jobs failed:"
            printf '%s\n' "$failed_jobs"
            exit 1
          fi

  # Prepare Bazel CI for this platform before the later jobs run. Similar in intent to
  # setup-go, this job uses setup-bazel to check Bazel metadata and prepare cache
  # state for the dependencies that subsequent jobs are expected to need. That shifts
  # network access into one upfront step instead of having each later job discover
  # missing dependencies on its own.
  setup:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.setup_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bazel
        with:
          is-setup-job: 'true'

  unit:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.unit_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests with Bazel
        uses: ./.github/actions/run-bazel-with-disk-space
        with:
          run: ./scripts/run_task.sh ${{ inputs.run_race_shuffle_unit_tests && 'bazel-test-unit-race-shuffle' || 'bazel-test-unit' }}

  build-avalanchego:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.e2e_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and stage avalanchego for E2E tests
        uses: ./.github/actions/run-bazel-with-disk-space
        with:
          run: ./scripts/run_task.sh bazel-stage-avalanchego
      - uses: actions/upload-artifact@v6
        with:
          name: bazel-e2e-avalanchego-${{ inputs.platform_name }}
          path: build/bazel-e2e/avalanchego

  build-e2e-runtime:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.e2e_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and stage E2E runtime binaries
        uses: ./.github/actions/run-bazel-with-disk-space
        with:
          run: ./scripts/run_task.sh bazel-stage-e2e-runtime
      - uses: actions/upload-artifact@v6
        with:
          name: bazel-e2e-runtime-${{ inputs.platform_name }}
          path: build/bazel-e2e/runtime

  e2e:
    needs:
      - build-avalanchego
      - build-e2e-runtime
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.e2e_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: bazel-e2e-avalanchego-${{ inputs.platform_name }}
          path: build/bazel-e2e/avalanchego
      - uses: actions/download-artifact@v6
        with:
          name: bazel-e2e-runtime-${{ inputs.platform_name }}
          path: build/bazel-e2e/runtime
      - name: Run E2E tests from staged Bazel binaries
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: ./scripts/run_task.sh bazel-test-e2e-staged
          artifact_prefix: e2e-bazel-${{ inputs.platform_name }}
          filter_by_owner: avalanchego-e2e
          prometheus_url: ${{ secrets.PROMETHEUS_URL || '' }}
          prometheus_push_url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_url: ${{ secrets.LOKI_URL || '' }}
          loki_push_url: ${{ secrets.LOKI_PUSH_URL || '' }}
          loki_username: ${{ secrets.LOKI_USERNAME || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}
