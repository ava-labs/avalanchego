name: Run fuzz tests

on:
  schedule:
    - cron: "0 0 * * *" # Once a day at midnight UTC
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    permissions:
      contents: read
    name: fuzz (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard:
          - database
          - codec
          - utils
          - x/archivedb
          - vms/platformvm
          - vms/evm
          - simplex
          - graft
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go-for-project
      - name: Run fuzz tests
        run: ./scripts/run_task.sh test-fuzz-long -- ./${{ matrix.shard }}
