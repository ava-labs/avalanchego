name: Bazel Full Test Jobs

# Reusable Bazel CI workflow. The pre-merge and scheduled callers select the platform
# and test configuration.
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      run_race_shuffle_unit_tests:
        description: 'Run unit tests with race detection and shuffled test order'
        required: false
        type: boolean
        default: false
      enable_remote_cache:
        description: 'Enable the remote Bazel cache'
        required: false
        type: boolean
        default: true
      setup_timeout_minutes:
        description: 'Timeout for the setup job'
        required: false
        type: number
        default: 10
      unit_timeout_minutes:
        description: 'Timeout for the unit-test job'
        required: false
        type: number
        default: 30
      e2e_timeout_minutes:
        description: 'Timeout for the E2E job'
        required: false
        type: number
        default: 30
      image_timeout_minutes:
        description: 'Timeout for the multi-platform image job'
        required: false
        type: number
        default: 30

env:
  BAZEL_CI_ENFORCE_DEPENDENCY_LIST: 1
  BAZEL_REMOTE_CACHE_ENABLED: ${{ inputs.enable_remote_cache }}
  BAZEL_REMOTE_CACHE_URL: ${{ secrets.BAZEL_REMOTE_CACHE_URL || '' }}
  BAZEL_REMOTE_CACHE_AUTH_HEADER: ${{ secrets.BAZEL_REMOTE_CACHE_AUTH_HEADER || '' }}

permissions:
  contents: read

jobs:
  # Prepare Bazel CI for this platform before the later jobs run. Similar in intent to
  # setup-go, this job uses setup-bazel to check Bazel metadata and prepare cache
  # state for the dependencies that subsequent jobs are expected to need. That shifts
  # network access into one upfront step instead of having each later job discover
  # missing dependencies on its own.
  setup:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.setup_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bazel
        with:
          is-setup-job: 'true'

  build-avalanchego-image:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.image_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bazel
      - id: avalanchego-image-docker-cache-key
        if: ${{ runner.os == 'Linux' }}
        run: ./scripts/workflow-avalanchego-image-docker-cache-key.sh
      - id: restore-avalanchego-image-docker-cache
        if: ${{ runner.os == 'Linux' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/avalanchego-bazel-image/docker-images.tar
          key: ${{ steps.avalanchego-image-docker-cache-key.outputs.key }}
      - id: avalanchego-image-docker-cache-policy
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/cache-policy
        with:
          request-cache-save: ${{ steps.restore-avalanchego-image-docker-cache.outputs.cache-hit != 'true' }}
      - name: Test multi-platform AvalancheGo image with Bazel
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/run-docker-with-disk-space
        env:
          BAZEL_IMAGE_DOCKER_CACHE_ARCHIVE: ${{ runner.temp }}/avalanchego-bazel-image/docker-images.tar
          BAZEL_IMAGE_WRITE_DOCKER_CACHE: ${{ steps.avalanchego-image-docker-cache-policy.outputs.cache-save-allowed }}
        with:
          setup-qemu: 'true'
          docker-username: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_USERNAME || '' }}
          docker-password: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_PASSWORD || '' }}
          run: BAZEL_IMAGE_REPOSITORY_CACHE="$HOME/.cache/bazel-repository-cache" ./scripts/run_task.sh bazel-test-build-image-avalanchego
      - name: Save AvalancheGo image Docker cache
        if: ${{ runner.os == 'Linux' && steps.avalanchego-image-docker-cache-policy.outputs.cache-save-allowed == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/avalanchego-bazel-image/docker-images.tar
          key: ${{ steps.avalanchego-image-docker-cache-key.outputs.key }}

  build-subnet-evm-image:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.image_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bazel
      - id: avalanchego-image-docker-cache-key
        if: ${{ runner.os == 'Linux' }}
        run: ./scripts/workflow-avalanchego-image-docker-cache-key.sh
      - id: restore-avalanchego-image-docker-cache
        if: ${{ runner.os == 'Linux' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/avalanchego-bazel-image/docker-images.tar
          key: ${{ steps.avalanchego-image-docker-cache-key.outputs.key }}
      - id: avalanchego-image-docker-cache-policy
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/cache-policy
        with:
          request-cache-save: ${{ steps.restore-avalanchego-image-docker-cache.outputs.cache-hit != 'true' }}
      - name: Test multi-platform Subnet-EVM image with Bazel
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/run-docker-with-disk-space
        env:
          BAZEL_IMAGE_DOCKER_CACHE_ARCHIVE: ${{ runner.temp }}/avalanchego-bazel-image/docker-images.tar
          BAZEL_IMAGE_WRITE_DOCKER_CACHE: ${{ steps.avalanchego-image-docker-cache-policy.outputs.cache-save-allowed }}
        with:
          setup-qemu: 'true'
          docker-username: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_USERNAME || '' }}
          docker-password: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_PASSWORD || '' }}
          run: BAZEL_IMAGE_REPOSITORY_CACHE="$HOME/.cache/bazel-repository-cache" ./scripts/run_task.sh bazel-test-build-image-subnet-evm
      - name: Save AvalancheGo image Docker cache
        if: ${{ runner.os == 'Linux' && steps.avalanchego-image-docker-cache-policy.outputs.cache-save-allowed == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/avalanchego-bazel-image/docker-images.tar
          key: ${{ steps.avalanchego-image-docker-cache-key.outputs.key }}

  unit:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.unit_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests with Bazel
        uses: ./.github/actions/run-bazel-with-disk-space
        with:
          run: ./scripts/run_task.sh ${{ inputs.run_race_shuffle_unit_tests && 'bazel-test-unit-race-shuffle' || 'bazel-test-unit' }}

  e2e:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.e2e_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Run E2E smoke test with Bazel-built binary
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: ./scripts/run_task.sh bazel-test-e2e-smoke
          setup_bazel: 'true'
          artifact_prefix: e2e-bazel-${{ inputs.platform_name }}
          filter_by_owner: avalanchego-e2e
          prometheus_url: ${{ secrets.PROMETHEUS_URL || '' }}
          prometheus_push_url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_url: ${{ secrets.LOKI_URL || '' }}
          loki_push_url: ${{ secrets.LOKI_PUSH_URL || '' }}
          loki_username: ${{ secrets.LOKI_USERNAME || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}
