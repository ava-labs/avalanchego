name: Bazel Full Test Jobs

# Reusable Bazel CI workflow. The pre-merge and scheduled callers select the platform
# and test configuration.
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      e2e_runner:
        description: 'Runner for the E2E job; defaults to runner'
        required: false
        type: string
        default: ''
      run_e2e_serially:
        description: 'Run the E2E job serially'
        required: false
        type: boolean
        default: false
      run_e2e_race_tests:
        description: 'Run E2E tests with race detection'
        required: false
        type: boolean
        default: false
      unit_test_task:
        description: 'Task to run for Bazel unit tests'
        required: true
        type: string
      run_monitored_tests:
        description: 'Run the monitored tests without race detection'
        required: false
        type: boolean
        default: false
      run_monitored_race_tests:
        description: 'Run the activation, load, and warp monitored tests with race detection'
        required: false
        type: boolean
        default: false
      enable_remote_cache:
        description: 'Enable the remote Bazel cache'
        required: false
        type: boolean
        default: true
      setup_timeout_minutes:
        description: 'Timeout for the setup job'
        required: false
        type: number
        default: 10
      unit_timeout_minutes:
        description: 'Timeout for the unit-test job'
        required: false
        type: number
        default: 30
      e2e_timeout_minutes:
        description: 'Timeout for the E2E job'
        required: false
        type: number
        default: 30
      image_timeout_minutes:
        description: 'Timeout for the multi-platform image job'
        required: false
        type: number
        default: 30

env:
  BAZEL_CI_ENFORCE_DEPENDENCY_LIST: 1
  BAZEL_REMOTE_CACHE_ENABLED: ${{ inputs.enable_remote_cache }}
  BAZEL_REMOTE_CACHE_URL: ${{ secrets.BAZEL_REMOTE_CACHE_URL || '' }}
  BAZEL_REMOTE_CACHE_AUTH_HEADER: ${{ secrets.BAZEL_REMOTE_CACHE_AUTH_HEADER || '' }}

permissions:
  contents: read

jobs:
  # Prepare Bazel CI for this platform before the later jobs run. Similar in intent to
  # setup-go, this job uses setup-bazel to check Bazel metadata and prepare cache
  # state for the dependencies that subsequent jobs are expected to need. That shifts
  # network access into one upfront step instead of having each later job discover
  # missing dependencies on its own.
  setup:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.setup_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bazel
        with:
          is-setup-job: 'true'
          setup-image-inputs: 'true'
          docker-username: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_USERNAME || '' }}
          docker-password: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_PASSWORD || '' }}

  build-image-avalanchego:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.image_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bazel
        with:
          setup-image-inputs: 'true'
          docker-username: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_USERNAME || '' }}
          docker-password: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_PASSWORD || '' }}
      - name: Test multi-platform AvalancheGo image with Bazel
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/run-docker-with-disk-space
        with:
          setup-qemu: 'true'
          preserve-docker-images: 'true'
          run: ./scripts/run_task.sh bazel-test-image-avalanchego

  unit:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.unit_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests with Bazel
        uses: ./.github/actions/run-bazel-with-disk-space
        with:
          run: ./scripts/run_task.sh ${{ inputs.unit_test_task }}

  e2e:
    needs: setup
    runs-on: ${{ inputs.e2e_runner || inputs.runner }}
    timeout-minutes: ${{ inputs.e2e_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and run E2E tests with Bazel
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: ./scripts/run_task.sh ${{ inputs.run_e2e_race_tests && inputs.run_e2e_serially && 'bazel-test-e2e-race-serial' || inputs.run_e2e_race_tests && 'bazel-test-e2e-race' || inputs.run_e2e_serially && 'bazel-test-e2e-serial' || 'bazel-test-e2e' }}
          setup_bazel: 'true'
          artifact_prefix: e2e-bazel-${{ inputs.platform_name }}
          filter_by_owner: avalanchego-e2e
          prometheus_url: ${{ secrets.PROMETHEUS_URL || '' }}
          prometheus_push_url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_url: ${{ secrets.LOKI_URL || '' }}
          loki_push_url: ${{ secrets.LOKI_PUSH_URL || '' }}
          loki_username: ${{ secrets.LOKI_USERNAME || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}

  # Keep the if conditions here so skipped jobs show readable names.
  # See docs/bazel.md#e2e-and-monitored-test-runners for the reason.
  monitored-race:
    name: monitored-race
    if: ${{ inputs.run_monitored_race_tests }}
    needs: setup
    uses: ./.github/workflows/bazel-monitored.yml
    with:
      # Reusable workflow inputs cannot accept matrices as lists or objects, so use a JSON string.
      # See docs/bazel.md#e2e-and-monitored-test-runners for alternatives and rationale.
      test_matrix: |
        {"include": [
          {"name": "e2e-post-latest", "task": "bazel-test-e2e-post-latest-race-serial", "network_owner": "avalanchego-e2e"},
          {"name": "e2e-schedule-latest", "task": "bazel-test-e2e-schedule-latest-race-serial", "network_owner": "avalanchego-e2e"},
          {"name": "load", "task": "bazel-test-load-ci-race"},
          {"name": "load-subnet-evm", "task": "bazel-test-load-subnet-evm-race", "network_owner": "subnet-evm-small-load"},
          {"name": "warp-subnet-evm", "task": "bazel-test-warp-subnet-evm-race", "network_owner": "subnet-evm-warp-e2e"}
        ]}
      job_suffix: -race
      runner: ${{ inputs.runner }}
      timeout_minutes: ${{ inputs.e2e_timeout_minutes }}
      enable_remote_cache: ${{ inputs.enable_remote_cache }}
    secrets: inherit

  monitored:
    name: monitored
    if: ${{ inputs.run_monitored_tests }}
    needs: setup
    uses: ./.github/workflows/bazel-monitored.yml
    with:
      # The load test has no network owner; leave its dashboard owner filter empty.
      test_matrix: |
        {"include": [
          {"name": "e2e-existing-network", "task": "bazel-test-e2e-existing-network", "network_owner": "avalanchego-e2e"},
          {"name": "e2e-post-latest", "task": "bazel-test-e2e-post-latest", "runner": "e2e_runner", "network_owner": "avalanchego-e2e"},
          {"name": "e2e-schedule-latest", "task": "bazel-test-e2e-schedule-latest", "runner": "e2e_runner", "network_owner": "avalanchego-e2e"},
          {"name": "load-subnet-evm", "task": "bazel-test-load-subnet-evm", "network_owner": "subnet-evm-small-load"},
          {"name": "warp-subnet-evm", "task": "bazel-test-warp-subnet-evm", "network_owner": "subnet-evm-warp-e2e"},
          {"name": "load", "task": "bazel-test-load-ci"},
          {"name": "upgrade", "task": "bazel-test-upgrade", "network_owner": "avalanchego-upgrade"}
        ]}
      runner: ${{ inputs.runner }}
      e2e_runner: ${{ inputs.e2e_runner }}
      timeout_minutes: ${{ inputs.e2e_timeout_minutes }}
      enable_remote_cache: ${{ inputs.enable_remote_cache }}
    secrets: inherit
