name: Bazel Full Test Jobs

# Reusable Bazel CI workflow. The pre-merge and scheduled callers select the platform
# and test configuration.
on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      e2e_runner:
        description: 'Runner for the E2E job; defaults to runner'
        required: false
        type: string
        default: ''
      run_e2e_serially:
        description: 'Run the E2E job serially'
        required: false
        type: boolean
        default: false
      run_e2e_race_tests:
        description: 'Run E2E tests with race detection'
        required: false
        type: boolean
        default: false
      run_binaries:
        description: 'Run Linux binary jobs'
        required: false
        type: boolean
        default: false
      run_race_shuffle_unit_tests:
        description: 'Run unit tests with race detection and shuffled test order'
        required: false
        type: boolean
        default: false
      enable_remote_cache:
        description: 'Enable the remote Bazel cache'
        required: false
        type: boolean
        default: true
      setup_timeout_minutes:
        description: 'Timeout for the setup job'
        required: false
        type: number
        default: 10
      unit_timeout_minutes:
        description: 'Timeout for the unit-test job'
        required: false
        type: number
        default: 30
      e2e_timeout_minutes:
        description: 'Timeout for the E2E job'
        required: false
        type: number
        default: 30

env:
  BAZEL_CI_ENFORCE_DEPENDENCY_LIST: 1
  BAZEL_REMOTE_CACHE_ENABLED: ${{ inputs.enable_remote_cache }}
  BAZEL_REMOTE_CACHE_URL: ${{ secrets.BAZEL_REMOTE_CACHE_URL || '' }}
  BAZEL_REMOTE_CACHE_AUTH_HEADER: ${{ secrets.BAZEL_REMOTE_CACHE_AUTH_HEADER || '' }}

permissions:
  contents: read

jobs:
  # Prepare Bazel CI for this platform before the later jobs run. Similar in intent to
  # setup-go, this job uses setup-bazel to check Bazel metadata and prepare cache
  # state for the dependencies that subsequent jobs are expected to need. That shifts
  # network access into one upfront step instead of having each later job discover
  # missing dependencies on its own.
  setup:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.setup_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bazel
        with:
          is-setup-job: 'true'

  unit:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.unit_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests with Bazel
        uses: ./.github/actions/run-bazel-with-disk-space
        with:
          run: ./scripts/run_task.sh ${{ inputs.run_race_shuffle_unit_tests && 'bazel-test-unit-race-shuffle' || 'bazel-test-unit' }}

  e2e:
    needs: setup
    runs-on: ${{ inputs.e2e_runner || inputs.runner }}
    timeout-minutes: ${{ inputs.e2e_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and run E2E tests with Bazel
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: ./scripts/run_task.sh ${{ inputs.run_e2e_race_tests && inputs.run_e2e_serially && 'bazel-test-e2e-race-serial' || inputs.run_e2e_race_tests && 'bazel-test-e2e-race' || inputs.run_e2e_serially && 'bazel-test-e2e-serial' || 'bazel-test-e2e' }}
          setup_bazel: 'true'
          artifact_prefix: e2e-bazel-${{ inputs.platform_name }}
          filter_by_owner: avalanchego-e2e
          prometheus_url: ${{ secrets.PROMETHEUS_URL || '' }}
          prometheus_push_url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_url: ${{ secrets.LOKI_URL || '' }}
          loki_push_url: ${{ secrets.LOKI_PUSH_URL || '' }}
          loki_username: ${{ secrets.LOKI_USERNAME || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}

  # A + suffix identifies jobs that use the configured higher-capacity E2E runner.
  binaries:
    name: monitored (${{ matrix.name }}${{ matrix.runner == 'e2e_runner' && '+' || '' }})
    if: ${{ inputs.run_binaries }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e-existing-network
          - name: e2e-post-latest
            runner: e2e_runner
          - name: e2e-schedule-latest
            runner: e2e_runner
          - name: load-subnet-evm
          - name: warp-subnet-evm
          - name: load
            task: load-ci
          - name: upgrade
    runs-on: ${{ matrix.runner == 'e2e_runner' && (inputs.e2e_runner || inputs.runner) || inputs.runner }}
    timeout-minutes: ${{ inputs.e2e_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
      - name: Run ${{ matrix.name }} with Bazel-built inputs
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: ./scripts/run_task.sh bazel-test-${{ matrix.task || matrix.name }}
          setup_bazel: 'true'
          artifact_prefix: bazel-${{ matrix.name }}
          filter_by_owner: avalanchego-e2e
          prometheus_url: ${{ secrets.PROMETHEUS_URL || '' }}
          prometheus_push_url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_url: ${{ secrets.LOKI_URL || '' }}
          loki_push_url: ${{ secrets.LOKI_PUSH_URL || '' }}
          loki_username: ${{ secrets.LOKI_USERNAME || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}
