name: Go Test Jobs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  setup-cache-darwin-arm64:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-workflow-cache-producer

  setup-cache-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-workflow-cache-producer

  build-antithesis-images-avalanchego:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check image build for avalanchego test setup
        uses: ./.github/actions/run-docker-with-disk-space
        with:
          run: ./scripts/run_task.sh test-build-antithesis-images-avalanchego

  build-antithesis-images-subnet-evm:
    needs: setup-cache-linux-amd64
    # Use a faster runner pending migration to bazel. The default free runners result
    # in 20+ minute runtime, slowing down every PR and merge queue CI run.
    runs-on: ubuntu-24.04-amd64-4-core
    steps:
      - uses: actions/checkout@v5
      - name: Check image build for subnet-evm test setup
        uses: ./.github/actions/run-docker-with-disk-space
        with:
          run: ./scripts/run_task.sh test-build-antithesis-images-subnet-evm

  build-image-avalanchego:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check image build
        uses: ./.github/actions/run-docker-with-disk-space
        with:
          setup-qemu: 'true'
          docker-username: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_USERNAME || '' }}
          docker-password: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_PASS || '' }}
          run: ./scripts/run_task.sh test-build-image

  build-image-subnet-evm:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check image build
        uses: ./.github/actions/run-docker-with-disk-space
        with:
          setup-qemu: 'true'
          docker-username: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_USERNAME || '' }}
          docker-password: ${{ github.ref == 'refs/heads/master' && secrets.DOCKER_PASS || '' }}
          run: ./scripts/run_task.sh test-build-image
          working_directory: ./graft/subnet-evm

  checks:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop --command bash -x {0}
    steps:
      - uses: actions/checkout@v5
      # The dev shell provides the generators and restores the Go module cache.
      - uses: ./.github/actions/install-nix

      - id: contract-bindings
        name: Check generated contract bindings
        continue-on-error: true
        run: ./scripts/run_task.sh check-generate-load-contract-bindings
      - name: Restore clean checkout after contract bindings check
        if: ${{ !cancelled() }}
        run: git reset --hard HEAD && git clean -ffd

      - id: canoto
        name: Check generated Canoto code
        continue-on-error: true
        run: ./scripts/run_task.sh check-generate-canoto
      - name: Restore clean checkout after Canoto check
        if: ${{ !cancelled() }}
        run: git reset --hard HEAD && git clean -ffd

      - id: mocks
        name: Check generated mocks
        continue-on-error: true
        run: ./scripts/run_task.sh check-generate-mocks
      - name: Restore clean checkout after mocks check
        if: ${{ !cancelled() }}
        run: git reset --hard HEAD && git clean -ffd

      - id: protobuf
        name: Check generated protobuf
        continue-on-error: true
        run: ./scripts/run_task.sh check-generate-protobuf
      - name: Restore clean checkout after protobuf check
        if: ${{ !cancelled() }}
        run: git reset --hard HEAD && git clean -ffd

      - id: links
        name: Check links
        continue-on-error: true
        uses: umbrelladocs/action-linkspector@de84085e0f51452a470558693d7d308fbb2fa261 # v1.2.5
        with:
          fail_level: any

      - id: tauseconds
        name: Check for TauSeconds misuse with time.Add()
        continue-on-error: true
        run: |
          if grep -rn '\.Add([^)]*TauSeconds' --include='*.go' .; then
            echo "ERROR: Use params.Tau (time.Duration) with time.Add(), not TauSeconds (int)"
            echo "TauSeconds would be interpreted as nanoseconds, not seconds"
            exit 1
          fi

      - name: Fail if any check failed
        if: ${{ !cancelled() }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          failed_checks="$(
            jq -r '
              to_entries[]
              | select(.value.outcome == "failure")
              | .key
            ' <<<"$STEPS_JSON"
          )"

          if [[ -n "$failed_checks" ]]; then
            echo 'Failed checks:'
            sed 's/^/  /' <<<"$failed_checks"
            exit 1
          fi

  e2e:
    needs: setup-cache-linux-amd64
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The default free runners lack the resources for parallel execution, so
        # a beefier runner is required.
        os: [ubuntu-24.04-amd64-4-core]
    steps:
      - uses: actions/checkout@v5
      - id: setup-go
        uses: ./.github/actions/setup-go-for-project
      - id: cache-policy
        uses: ./.github/actions/cache-policy
        with:
          request-cache-save: 'true'
      - id: cache-key
        name: Determine Go e2e build-cache key
        shell: bash
        run: |
          cache_key_prefix="go-e2e-${{ matrix.os }}-${{ runner.arch }}-"
          echo "cache-key=${cache_key_prefix}$(./scripts/workflow-hash-go-unit-inputs.sh)" >> "$GITHUB_OUTPUT"
          echo "cache-key-prefix=${cache_key_prefix}" >> "$GITHUB_OUTPUT"
      - id: e2e-cache
        name: Restore Go e2e build cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ steps.cache-key.outputs.cache-key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.cache-key-prefix }}
      - name: Run e2e tests
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: ./scripts/run_task.sh test-e2e
          artifact_prefix: e2e-${{ matrix.os }}
          filter_by_owner: avalanchego-e2e
          prometheus_url: ${{ secrets.PROMETHEUS_URL || '' }}
          prometheus_push_url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_url: ${{ secrets.LOKI_URL || '' }}
          loki_push_url: ${{ secrets.LOKI_PUSH_URL || '' }}
          loki_username: ${{ secrets.LOKI_USERNAME || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}
      - name: Save Go e2e build cache
        if: ${{ steps.cache-policy.outputs.cache-save-allowed == 'true' && steps.e2e-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup-go.outputs.go-build-cache-path }}
          key: ${{ steps.cache-key.outputs.cache-key }}

  e2e-bootstrap-monitor:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop --command bash -x {0}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ensure-disk-space
        with:
          diagnostic-groups: docker
      - id: install-nix
        uses: ./.github/actions/install-nix
      - name: Run e2e tests
        run: ./scripts/run_task.sh test-bootstrap-monitor-e2e
      - name: Log Docker disk diagnostics
        if: ${{ failure() && steps.install-nix.outcome == 'success' }}
        run: ./scripts/run_task.sh log-ci-disk-state-docker
      - name: Collect kind diagnostics
        if: ${{ failure() && steps.install-nix.outcome == 'success' }}
        uses: ./.github/actions/collect-kind-diagnostics
        with:
          artifact_name: bootstrap-monitor-kind-diagnostics

  e2e-kube:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: ./scripts/run_task.sh test-e2e-kube-ci
          runtime: kube
          artifact_prefix: e2e-kube
          filter_by_owner: avalanchego-e2e
          prometheus_url: ${{ secrets.PROMETHEUS_URL || '' }}
          prometheus_push_url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_url: ${{ secrets.LOKI_URL || '' }}
          loki_push_url: ${{ secrets.LOKI_PUSH_URL || '' }}
          loki_username: ${{ secrets.LOKI_USERNAME || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}

  fuzz:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-for-project
      - name: test-fuzz
        shell: bash
        run: ./scripts/run_task.sh test-fuzz

  lint-avalanchego:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop --command bash -x {0}
    steps:
      - uses: actions/checkout@v5
      # Bazel is required by lint-all-ci since it runs check-go-mod-tidy, which
      # invokes `bazelisk mod tidy`. Since preparation of Bazel dependencies may
      # involve downloading Go modules, it needs to happen before install-nix disables
      # GOPROXY.
      - uses: ./.github/actions/setup-bazel
        env:
          # This job does not build Bazel targets.
          BAZEL_REMOTE_CACHE_ENABLED: 'false'
      - uses: ./.github/actions/install-nix
      - name: Runs all lint checks
        run: ./scripts/run_task.sh lint-all-ci

  lint-coreth:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop --command bash -x {0}
        working-directory: ./graft/coreth
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-nix
      - name: Run all lint checks
        run: ./scripts/run_task.sh lint-all-ci
      - name: Check go.mod and go.sum are up-to-date
        run: ./scripts/run_task.sh check-go-mod-tidy

  lint-evm:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./graft/evm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go-for-project
      - name: Run all lint checks
        run: ../../scripts/run_task.sh lint-all-ci
      - name: Check go.mod and go.sum are up-to-date
        run: ../../scripts/run_task.sh check-go-mod-tidy

  lint-subnet-evm:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop --command bash -x {0}
        working-directory: ./graft/subnet-evm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-nix
      - name: Run all lint checks
        run: ./scripts/run_task.sh lint-all-ci
      - name: Check go.mod and go.sum are up-to-date
        run: ./scripts/run_task.sh check-go-mod-tidy

  # Re-enable once images are built by Bazel and can be cached; otherwise, this job is too expensive for what it evaluates.
  # load_kube_kind:
  #   name: Run load test on kind cluster
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: ./.github/actions/run-monitored-tmpnet-cmd
  #       with:
  #         run: ./scripts/run_task.sh test-load-kube-kind-ci
  #         runtime: kube
  #         artifact_prefix: load-kube
  #         prometheus_url: ${{ secrets.PROMETHEUS_URL || '' }}
  #         prometheus_push_url: ${{ secrets.PROMETHEUS_PUSH_URL || '' }}
  #         prometheus_username: ${{ secrets.PROMETHEUS_USERNAME || '' }}
  #         prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
  #         loki_url: ${{ secrets.LOKI_URL || '' }}
  #         loki_push_url: ${{ secrets.LOKI_PUSH_URL || '' }}
  #         loki_username: ${{ secrets.LOKI_USERNAME || '' }}
  #         loki_password: ${{ secrets.LOKI_PASSWORD || '' }}

  robustness:
    needs: setup-cache-linux-amd64
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop --command bash -x {0}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ensure-disk-space
        with:
          diagnostic-groups: docker
      - id: install-nix
        uses: ./.github/actions/install-nix
      # TODO(marun) Extend testing of robustness beyond deploying a suitable test environment
      - name: Deploy kind with chaos mesh
        run: ./scripts/run_task.sh test-robustness
      - name: Log Docker disk diagnostics
        if: ${{ failure() && steps.install-nix.outcome == 'success' }}
        run: ./scripts/run_task.sh log-ci-disk-state-docker
      - name: Collect kind diagnostics
        if: ${{ failure() && steps.install-nix.outcome == 'success' }}
        uses: ./.github/actions/collect-kind-diagnostics
        with:
          artifact_name: robustness-kind-diagnostics

  # macOS runners are slower and less reliable than Linux runners.
  # Pre-merge CI runs only a smoke test on macOS. The scheduled Go workflow
  # runs the full suite on macOS.
  smoke:
    name: darwin-arm64
    needs: setup-cache-darwin-arm64
    uses: ./.github/workflows/go-smoke.yml
    with:
      platform_name: darwin-arm64
      runner: macos-26
    secrets: inherit

  unit:
    name: linux-amd64
    needs: setup-cache-linux-amd64
    uses: ./.github/workflows/go-unit.yml
    with:
      platform_name: linux-amd64
      runner: ubuntu-24.04
      clear_unit_test_results: false
    secrets: inherit
