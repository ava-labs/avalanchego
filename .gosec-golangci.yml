version: "2"
linters:
  default: none
  enable:
    - gosec
  exclusions:
    rules:
      # Mirrors the test exclusions in .golangci.yml. This config exists to run
      # G115 over the saevm production code, which .golangci.yml still excludes.
      - path: "(^tests/)|(^(.*/)*test_[^/]*\\.go$)|(.*test/.*)|(.*_test\\.go$)"
        linters:
          - gosec
