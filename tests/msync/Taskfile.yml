version: '3'

vars:
  TESTS_MSYNC_REPO_ROOT:
    sh: cd "{{.TASKFILE_DIR}}/../.." && pwd
  TESTS_MSYNC_NIX_RUN: '{{.TESTS_MSYNC_REPO_ROOT}}/scripts/nix_run.sh'

tasks:
  e2e:
    desc: Run standalone merkle sync bootstrap validation with bazel-built binary
    cmds:
      - task: _e2e-run
        vars:
          BAZEL_CONFIG: ''
          MSYNC_ARGS: '{{.CLI_ARGS}}'

  e2e-ci:
    desc: Run standalone merkle sync bootstrap validation with race-built bazel avalanchego binary
    cmds:
      - task: _e2e-run
        vars:
          BAZEL_CONFIG: '--config=race'
          MSYNC_ARGS: '{{.CLI_ARGS}}'

  e2e-ci-firewood:
    desc: Run standalone merkle sync bootstrap validation for the firewood state scheme with race-built bazel avalanchego binary
    cmds:
      - task: _e2e-run
        vars:
          BAZEL_CONFIG: '--config=race'
          # Preceding CLI_ARGS ensures an explicit --state-scheme still wins.
          MSYNC_ARGS: '--state-scheme=firewood {{.CLI_ARGS}}'

  _e2e-run:
    internal: true
    cmds:
      - cmd: |
          cd {{.TESTS_MSYNC_REPO_ROOT}} && {{.TESTS_MSYNC_NIX_RUN}} bazelisk build {{.BAZEL_CONFIG}} //main:avalanchego
      - cmd: |
          cd {{.TESTS_MSYNC_REPO_ROOT}} && {{.TESTS_MSYNC_NIX_RUN}} env -u AVALANCHEGO_PATH bash -c 'avalanchego_path=$(realpath "$(bazelisk cquery {{.BAZEL_CONFIG}} --output=files //main:avalanchego 2>/dev/null)"); go run ./tests/msync/main --avalanchego-path="$avalanchego_path" {{.MSYNC_ARGS}}'
