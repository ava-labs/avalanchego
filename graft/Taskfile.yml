# https://taskfile.dev
# To run on a system without task installed, `../scripts/run_task.sh` will
# prefer host task, otherwise use the repo's nix-pinned task when nix is
# installed, otherwise bootstrap task via `go tool`.
# If in the nix dev shell, repo tasks use the pinned toolchain.

version: '3'

vars:
  # Task entrypoints run through the repo's nix wrapper so they use the pinned
  # dev-shell toolchain when nix is available, without nesting nix shells.
  NIX_RUN: '{{printf "%s/../scripts/nix_run.sh" .TASKFILE_DIR}}'
  # REPO_MODULE: github.com/ava-labs/REPO_NAME

tasks:
  default: '{{.NIX_RUN}} {{.TASKFILE_DIR}}/../scripts/run_task.sh --list'

  # REPO_NAME-rewrite-imports:
  #   desc: Rewrite imports of out-of-tree REPO_NAME to in-tree REPO_NAME
  #   cmd: bash {{.TASKFILE_DIR}}/scripts/rewrite-imports.sh {{.REPO_MODULE}}

  # REPO_NAME-subtree-merge:
  #   desc: Perform git subtree merge of REPO_NAME into graft/REPO_NAME from a local source (commits)
  #   cmd: bash {{.TASKFILE_DIR}}/scripts/subtree-merge.sh BRANCH {{.CLI_ARGS}} graft/REPO_NAME

  firewood-subtree-merge:
    desc: Perform git subtree merge of firewood into firewood from a local source (commits)
    preconditions:
      - sh: 'test -n "{{.CLI_ARGS}}"'
        msg: "Usage: task graft:firewood-subtree-merge -- <source-path>"
    cmd: bash {{.TASKFILE_DIR}}/scripts/subtree-merge.sh main {{.CLI_ARGS}} firewood
